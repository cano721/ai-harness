name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Bash syntax
        run: bash -n scripts/*.sh scripts/board/*.sh tests/*.sh
      - name: ShellCheck
        run: shellcheck -x scripts/*.sh scripts/board/*.sh tests/*.sh
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Regression tests
        timeout-minutes: 15
        run: bash tests/run.sh --shard ${{ matrix.shard }}/4
