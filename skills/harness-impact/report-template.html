<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하네스 도입 효과</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11, 11, 11, 0.10);
  --series: #2a78d6;
  --series-soft: rgba(42, 120, 214, 0.08);
  --good: #006300;
  --bad: #d03b3b;
  --warn: #fab219;
  --install: #eb6834;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --ring: rgba(255, 255, 255, 0.10);
    --series: #3987e5;
    --series-soft: rgba(57, 135, 229, 0.12);
    --good: #0ca30c;
    --bad: #e66767;
    --install: #d95926;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --ring: rgba(255, 255, 255, 0.10);
  --series: #3987e5;
  --series-soft: rgba(57, 135, 229, 0.12);
  --good: #0ca30c;
  --bad: #e66767;
  --install: #d95926;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
}
main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
header .meta { color: var(--ink-2); font-size: 13px; }
h1 { font-size: 26px; line-height: 1.3; margin: 8px 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 17px; margin: 40px 0 12px; }
.sub { color: var(--ink-2); margin: 0 0 4px; }
.card {
  background: var(--surface);
  border: 1px solid var(--ring);
  border-radius: 12px;
  padding: 16px;
}
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px; margin-top: 24px; }
.kpi .label { color: var(--ink-2); font-size: 13px; }
.kpi .value { font-size: 28px; font-weight: 650; margin: 4px 0 2px; letter-spacing: -0.01em; }
.kpi .from { color: var(--muted); font-size: 15px; font-weight: 400; }
.kpi .delta { font-size: 13px; font-weight: 600; }
.kpi .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
.kpi.dim { opacity: 0.6; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.flat { color: var(--ink-2); }
.list { display: grid; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.row .when { color: var(--muted); font-size: 13px; min-width: 88px; font-variant-numeric: tabular-nums; }
.row .what { flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
.row .tag { font-size: 12px; color: var(--ink-2); border: 1px solid var(--ring); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.expected { color: var(--ink-2); font-size: 13px; }
.groups .row .what { font-weight: 550; }
.groups .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
.cols h3 { font-size: 14px; margin: 0 0 8px; color: var(--ink-2); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tabs button, .linkbtn {
  font: inherit; font-size: 13px; color: var(--ink-2); background: transparent;
  border: 1px solid var(--ring); border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
.tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-2); font-weight: 600; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  white-space: nowrap; display: none;
}
.tip strong { font-size: 15px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-2); font-weight: 600; }
.warn-list li { margin: 4px 0; }
.empty { color: var(--muted); }
footer { margin-top: 48px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = /*__IMPACT_DATA__*/null;
const HIGHLIGHTS = /*__IMPACT_HIGHLIGHTS__*/null;

const app = document.getElementById("app");
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;
    if (k === "class") n.className = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null) continue;
    n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return n;
}
const svgNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs) {
  const n = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  return n;
}
const fmt = (v, d = 1) => v == null ? "–" : (Number.isInteger(v) ? String(v) : v.toFixed(d));
const B = DATA.periods.before, A = DATA.periods.after;
const warnings = new Set(DATA.warnings || []);

// 지표 정의: lower=true면 줄어드는 쪽이 좋아진 것
const METRICS = [
  { key: "corrections_per_session", label: "반복 교정 (세션당)", lower: true, n: p => p.digested_sessions,
    note: "LLM 세션 정리가 찾은 사용자 교정. 같은 말을 다시 하게 된 횟수" },
  { key: "guard_blocks", label: "하네스가 막은 위험 작업", lower: null, n: p => p.sessions,
    note: "편집 가드가 멈춘 수정. 늘면 막아준 것이 늘어난 것" },
  { key: "turns_median", label: "작업당 주고받은 턴 (중앙값)", lower: true, n: p => p.active_sessions,
    note: "턴 5 이상 세션 기준" },
  { key: "errors_per_session", label: "툴 오류 (세션당)", lower: true, n: p => p.sessions,
    note: "실패한 명령·툴 호출" },
];

function delta(m, b, a) {
  if (b == null || a == null) return { text: "비교 불가", cls: "flat" };
  if (b === a) return { text: "변화 없음", cls: "flat" };
  if (m.lower === null) {
    const diff = a - b;
    return { text: (diff > 0 ? "▲ " : "▼ ") + Math.abs(diff) + "건", cls: "flat" };
  }
  const pct = b === 0 ? null : Math.round(Math.abs(a - b) / b * 100);
  const better = m.lower ? a < b : a > b;
  const arrow = a < b ? "▼" : "▲";
  return { text: arrow + " " + (pct == null ? "" : pct + "% ") + (better ? "개선" : "악화"), cls: better ? "good" : "bad" };
}

function autoHeadline() {
  const parts = [];
  const cb = B.corrections_per_session, ca = A.corrections_per_session;
  if (cb != null && ca != null && cb > 0 && ca < cb) parts.push("같은 지적이 " + Math.round((cb - ca) / cb * 100) + "% 줄었고");
  if (A.guard_blocks > 0) parts.push("위험한 수정 " + A.guard_blocks + "건을 막았어요");
  const tb = B.turns_median, ta = A.turns_median;
  if (!parts.length && tb != null && ta != null && ta < tb) parts.push("작업당 턴이 " + fmt(tb) + " → " + fmt(ta) + "로 줄었어요");
  if (!parts.length) return "도입 전후 변화를 정리했어요";
  return parts.join(", ");
}

// 헤더
app.append(el("header", {},
  el("div", { class: "meta" }, DATA.project, " · 설치 ", DATA.installed.date,
    " · 설치 전 ", B.since, "~", B.until, " vs 최근 ", A.since, "~", A.until, " (각 ", DATA.window_days, "일, 끝 날짜 미포함)"),
  el("h1", {}, (HIGHLIGHTS && HIGHLIGHTS.headline) || autoHeadline()),
  el("p", { class: "sub" }, "설치 전 ", B.sessions, "세션 · 최근 ", A.sessions,
    "세션을 비교했어요. 숫자는 변화이고, 원인은 아래 신뢰도와 함께 판단해 주세요.")
));

// 체감 카드
const lowSample = warnings.has("low_sample") || warnings.has("before_missing");
const kpis = el("section", { class: "kpis", "aria-label": "핵심 지표" });
for (const m of METRICS) {
  const b = B[m.key], a = A[m.key], d = delta(m, b, a);
  const dim = m.n(B) < 10 || m.n(A) < 10;
  kpis.append(el("div", { class: "card kpi" + (dim ? " dim" : "") },
    el("div", { class: "label" }, m.label),
    el("div", { class: "value" }, el("span", { class: "from" }, fmt(b), " → "), fmt(a)),
    el("div", { class: "delta " + d.cls }, d.text),
    el("div", { class: "note" }, m.note, dim ? " · 표본 적음" : "")));
}
if (DATA.rework && DATA.rework.before && DATA.rework.after) {
  const rb = DATA.rework.before.rework_ratio, ra = DATA.rework.after.rework_ratio;
  const d = delta({ lower: true }, rb, ra);
  kpis.append(el("div", { class: "card kpi" },
    el("div", { class: "label" }, "재작업 PR 비율"),
    el("div", { class: "value" }, el("span", { class: "from" }, fmt(rb), "% → "), fmt(ra), "%"),
    el("div", { class: "delta " + d.cls }, d.text),
    el("div", { class: "note" }, "머지 뒤 같은 이슈로 다시 PR을 연 비율 · PR ",
      DATA.rework.before.settled_prs, " → ", DATA.rework.after.settled_prs, "건")));
}
app.append(kpis);

// 사례
const hasGroups = HIGHLIGHTS && (HIGHLIGHTS.groups || []).length;
app.append(el("h2", {}, hasGroups ? "줄어든 반복 지적" : "교정 기록"));
if (hasGroups) {
  const g = el("div", { class: "card list groups" });
  for (const x of HIGHLIGHTS.groups) {
    g.append(el("div", { class: "row" },
      el("span", { class: "what" }, x.label),
      el("span", { class: "num" }, "설치 전 ", x.before, "회 → 후 ", x.after, "회")));
  }
  app.append(g);
} else {
  const col = (title, items) => el("div", { class: "card" }, el("h3", {}, title),
    items.length ? el("div", { class: "list" }, items.slice(0, 8).map(c =>
      el("div", { class: "row" }, el("span", { class: "when" }, c.date), el("span", { class: "what" }, c.summary))))
    : el("p", { class: "empty" }, "기록 없음"));
  app.append(el("div", { class: "cols" },
    col("설치 전 교정", DATA.corrections.before.items), col("최근 교정", DATA.corrections.after.items)));
}
if (HIGHLIGHTS && (HIGHLIGHTS.cases || []).length) {
  app.append(el("h2", {}, "이번 기간 하이라이트"));
  const c = el("div", { class: "list" });
  for (const x of HIGHLIGHTS.cases) {
    c.append(el("div", { class: "card" }, el("strong", {}, x.title), x.detail ? el("p", { class: "expected" }, x.detail) : null));
  }
  app.append(c);
}

// 성장 타임라인
app.append(el("h2", {}, "하네스가 배운 것"));
if ((DATA.timeline || []).length) {
  const t = el("div", { class: "card list" });
  for (const x of DATA.timeline) {
    t.append(el("div", { class: "row" },
      el("span", { class: "when" }, x.date),
      el("span", { class: "what" }, x.summary || "",
        x.expected ? el("div", { class: "expected" }, "기대: ", x.expected) : null),
      el("span", { class: "tag" }, x.kind === "harvest" ? "harvest 개선" : (x.scope === "global" ? "전역 규칙" : "자동 규칙"))));
  }
  app.append(t);
} else {
  app.append(el("p", { class: "empty" }, "이 기간에 반영된 개선이 없어요. /harvest 가 개선을 반영하면 여기에 쌓여요."));
}

// 주간 추이
const SERIES = [
  { key: "corrections_per_session", label: "교정/세션" },
  { key: "turns_median", label: "턴 중앙값" },
  { key: "errors_per_session", label: "오류/세션" },
  { key: "guard_blocks", label: "막은 위험" },
  { key: "sessions", label: "세션 수" },
];
app.append(el("h2", {}, "주간 추이"));
const tabs = el("div", { class: "tabs", role: "group", "aria-label": "지표 선택" });
const chartBox = el("div", { class: "card chart" });
const tableBox = el("div", { class: "card", hidden: "" });
const tableBtn = el("button", { class: "linkbtn", type: "button", "aria-pressed": "false" }, "표로 보기");
app.append(tabs, chartBox, tableBox);
let current = SERIES[0];
for (const s of SERIES) {
  const b = el("button", { type: "button", "aria-pressed": String(s === current) }, s.label);
  b.addEventListener("click", () => {
    current = s;
    for (const x of tabs.querySelectorAll("button[data-k]")) x.setAttribute("aria-pressed", String(x.dataset.k === s.key));
    drawChart();
  });
  b.dataset.k = s.key;
  tabs.append(b);
}
tabs.append(tableBtn);
tableBtn.addEventListener("click", () => {
  const show = tableBox.hasAttribute("hidden");
  tableBox.toggleAttribute("hidden", !show);
  tableBtn.setAttribute("aria-pressed", String(show));
});

function drawChart() {
  chartBox.replaceChildren();
  const weeks = DATA.weekly || [];
  const W = 900, H = 260, L = 44, R = 16, T = 16, Bm = 36;
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": current.label + " 주간 추이" });
  const vals = weeks.map(w => w[current.key]);
  const max = Math.max(1, ...vals.filter(v => v != null));
  const step = weeks.length > 1 ? (W - L - R) / (weeks.length - 1) : 0;
  const x = i => L + i * step;
  const y = v => T + (H - T - Bm) * (1 - v / max);
  // 설치 후 영역
  const firstAfter = weeks.findIndex(w => w.after_install);
  if (firstAfter >= 0) {
    const xi = firstAfter === 0 ? L : (x(firstAfter - 1) + x(firstAfter)) / 2;
    svg.append(sv("rect", { x: xi, y: T, width: W - R - xi, height: H - T - Bm, fill: "var(--series-soft)" }));
    svg.append(sv("line", { x1: xi, x2: xi, y1: T - 6, y2: H - Bm, stroke: "var(--install)", "stroke-width": 2, "stroke-dasharray": "4 4" }));
    const lab = sv("text", { x: xi + 6, y: T + 4, fill: "var(--ink-2)", "font-size": 12 });
    lab.textContent = "하네스 설치 " + DATA.installed.date;
    svg.append(lab);
  }
  // 격자 3단
  for (let k = 0; k <= 2; k++) {
    const v = max * k / 2, yy = y(v);
    svg.append(sv("line", { x1: L, x2: W - R, y1: yy, y2: yy, stroke: k === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    const t = sv("text", { x: L - 8, y: yy + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 });
    t.textContent = fmt(Math.round(v * 10) / 10);
    svg.append(t);
  }
  weeks.forEach((w, i) => {
    if (weeks.length > 10 && i % 2) return;
    const t = sv("text", { x: x(i), y: H - Bm + 18, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 });
    t.textContent = w.week.slice(5);
    svg.append(t);
  });
  // 선: 값이 없는 주는 끊는다
  let d = "", pen = false;
  vals.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    d += (pen ? "L" : "M") + x(i) + " " + y(v) + " ";
    pen = true;
  });
  svg.append(sv("path", { d, fill: "none", stroke: "var(--series)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  vals.forEach((v, i) => {
    if (v == null) return;
    svg.append(sv("circle", { cx: x(i), cy: y(v), r: 4, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2 }));
  });
  // 크로스헤어 + 툴팁
  const cross = sv("line", { y1: T, y2: H - Bm, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  const hit = sv("rect", { x: L, y: 0, width: W - L - R, height: H, fill: "transparent" });
  svg.append(hit);
  const tip = el("div", { class: "tip", role: "status" });
  chartBox.append(svg, tip);
  hit.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * W / r.width;
    const i = step ? Math.max(0, Math.min(weeks.length - 1, Math.round((px - L) / step))) : 0;
    const w = weeks[i];
    if (!w) return;
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    tip.replaceChildren(el("strong", {}, fmt(w[current.key])), " ", current.label,
      el("div", { class: "expected" }, w.week, " 주 · ", w.sessions, "세션 · ", w.after_install ? "설치 후" : "설치 전"));
    tip.style.display = "block";
    const left = x(i) * r.width / W;
    tip.style.left = Math.min(Math.max(0, left - 60), r.width - tip.offsetWidth) + "px";
    tip.style.top = "8px";
  });
  hit.addEventListener("pointerleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); });

  const tbl = el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "주"), el("th", {}, "구간"),
    ...SERIES.map(s => el("th", {}, s.label)))),
    el("tbody", {}, weeks.map(w => el("tr", {}, el("td", {}, w.week), el("td", {}, w.after_install ? "후" : "전"),
      ...SERIES.map(s => el("td", {}, fmt(w[s.key])))))));
  tableBox.replaceChildren(tbl);
}
drawChart();

// 도입 현황
app.append(el("h2", {}, "도입 현황 (최근 구간)"));
const ad = DATA.adoption;
app.append(el("div", { class: "card" },
  el("p", {}, "작업 세션 ", ad.active_sessions, "개 중 ", ad.harness_sessions,
    "개가 하네스 문서·워크플로를 사용했어요", ad.active_sessions ? " (" + Math.round(ad.harness_sessions * 100 / ad.active_sessions) + "%)." : "."),
  ad.top_docs.length ? el("div", { class: "list" }, ad.top_docs.map(d =>
    el("div", { class: "row" }, el("span", { class: "what" }, d.target), el("span", { class: "tag" }, d.n, "회")))) : null));

// 신뢰도
const WARN_TEXT = {
  before_missing: "설치 전 기록이 없어요. transcript가 보관 기간(기본 30일) 뒤 지워졌을 수 있어요. 전후 비교 대신 설치 후 추이만 보세요.",
  short_window: "설치한 지 7일이 안 돼 비교 구간이 짧아요.",
  gap: "최근 구간과 설치일 사이에 기간이 있어요. 그 사이 변화는 주간 추이에서 보세요.",
  low_sample: "한쪽 구간의 작업 세션이 10개 미만이라 우연한 차이일 수 있어요. 흐린 카드가 해당돼요.",
  few_digests: "LLM 세션 정리가 된 세션이 적어 교정 수치의 신뢰도가 낮아요.",
  model_shift: "두 구간에 주로 쓴 모델이 달라요. 턴·토큰 차이에 모델 영향이 섞여 있어요.",
};
app.append(el("h2", {}, "신뢰도와 한계"));
const models = p => Object.entries(p.models || {}).map(([k, v]) => k + " " + v).join(", ") || "–";
app.append(el("div", { class: "card" },
