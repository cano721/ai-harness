<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하네스 도입 효과</title>
<style>
/* 팔레트: dataviz 기본 인스턴스. 계열 2색(#2a78d6/#eb6834, 다크 #3987e5/#d95926)은 validate_palette.js 라이트·다크 통과.
   상태색(good/critical/warning)은 계열과 섞지 않고 항상 아이콘+문구와 함께 쓴다. */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11, 11, 11, 0.10);
  --series: #2a78d6;
  --series-soft: rgba(42, 120, 214, 0.08);
  --series-2: #eb6834;
  --context: #c3c2b7;
  --good: #006300;
  --bad: #d03b3b;
  --warn-ink: #8a5a00;
  --warn-soft: rgba(250, 178, 25, 0.16);
  --install: #52514e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --ring: rgba(255, 255, 255, 0.10);
    --series: #3987e5;
    --series-soft: rgba(57, 135, 229, 0.12);
    --series-2: #d95926;
    --context: #52514e;
    --good: #0ca30c;
    --bad: #e66767;
    --warn-ink: #fab219;
    --warn-soft: rgba(250, 178, 25, 0.12);
    --install: #c3c2b7;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --ring: rgba(255, 255, 255, 0.10);
  --series: #3987e5;
  --series-soft: rgba(57, 135, 229, 0.12);
  --series-2: #d95926;
  --context: #52514e;
  --good: #0ca30c;
  --bad: #e66767;
  --warn-ink: #fab219;
  --warn-soft: rgba(250, 178, 25, 0.12);
  --install: #c3c2b7;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
}
::selection { background: var(--series-soft); color: var(--ink); }
:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; border-radius: 4px; }
a { color: var(--series); text-underline-offset: 3px; }
main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
header .meta { color: var(--ink-2); font-size: 13px; }
h1 { font-size: 26px; line-height: 1.3; margin: 8px 0 8px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; margin: 48px 0 6px; }
h2 + .lead { margin: 0 0 14px; color: var(--ink-2); font-size: 13px; max-width: 70ch; }
.verdict { color: var(--ink-2); margin: 0; max-width: 70ch; }
.verdict b { color: var(--ink); font-weight: 600; }
.card {
  background: var(--surface);
  border: 1px solid var(--ring);
  border-radius: 12px;
  padding: 16px;
}
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; margin-top: 24px; }
.kpi .label { color: var(--ink-2); font-size: 13px; }
.kpi .value { font-size: 28px; font-weight: 650; margin: 4px 0 2px; letter-spacing: -0.01em; }
.kpi .from { color: var(--muted); font-size: 15px; font-weight: 400; }
.kpi .delta { font-size: 13px; font-weight: 600; }
.kpi .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.flat { color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.5;
  color: var(--warn-ink); background: var(--warn-soft); border-radius: 999px; padding: 0 8px;
}
.chip svg { flex: none; }
.list { display: grid; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.row .when { color: var(--muted); font-size: 13px; min-width: 88px; font-variant-numeric: tabular-nums; }
.row .what { flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
.row .tag { font-size: 12px; color: var(--ink-2); border: 1px solid var(--ring); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.expected { color: var(--ink-2); font-size: 13px; }
.groups .row .what { font-weight: 550; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
.cols h3, .card h3 { font-size: 14px; margin: 0 0 8px; color: var(--ink-2); }
/* 개선별 성과 */
.imp { display: grid; gap: 10px; }
.imp p { margin: 0; }
.imp details { margin-top: 0; }
.imp-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; }
.imp-title { font-weight: 600; flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.badge.gone, .badge.reduced { color: var(--good); }
.badge.recurred { color: var(--bad); }
.badge.hold, .badge.no_baseline, .badge.unmatched { color: var(--ink-2); }
.rates { display: grid; gap: 6px; }
.rate { display: grid; grid-template-columns: minmax(84px, 120px) 1fr minmax(96px, auto); gap: 10px; align-items: center; font-size: 13px; }
.rate .who { color: var(--ink-2); }
.rate .track { height: 10px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.rate .fill { display: block; height: 100%; border-radius: 4px; min-width: 2px; }
.rate .fill.zero { min-width: 0; }
.rate .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.evid { display: grid; gap: 4px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }
.evid li { display: flex; gap: 8px; }
.evid .when { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
/* 막은 위험 */
/* 가드 문구는 막은 대상과 이유가 앞 두 줄에 있다. 전체는 hover로 본다. */
.guard .row .what { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.guard .kind { font-size: 12px; color: var(--ink-2); border: 1px solid var(--ring); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tabs button, .linkbtn {
  font: inherit; font-size: 13px; color: var(--ink-2); background: transparent;
  border: 1px solid var(--ring); border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
.tabs button:hover, .linkbtn:hover { color: var(--ink); border-color: var(--axis); }
.tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-2); font-weight: 600; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  white-space: nowrap; display: none;
}
.tip strong { font-size: 15px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
td .chips { margin-top: 4px; }
.warn-list { margin: 0; padding-left: 18px; }
.warn-list li { margin: 4px 0; }
.empty { color: var(--muted); }
.bars { display: grid; gap: 6px; margin: 8px 0 4px; }
.bar { display: grid; grid-template-columns: 96px 1fr 48px; gap: 8px; align-items: center; font-size: 13px; }
.bar .track { height: 10px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 4px; }
.bar .pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.key { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }
.pass { color: var(--good); }
.fail { color: var(--bad); }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
pre { font-size: 12px; line-height: 1.45; overflow: auto; max-height: 360px; background: var(--page); border: 1px solid var(--ring); border-radius: 8px; padding: 10px; }
.abgrid { display: grid; gap: 12px; }
.stack { display: grid; gap: 12px; }
footer { margin-top: 48px; color: var(--muted); font-size: 12px; }
@media (max-width: 480px) {
  h1 { font-size: 22px; }
  .rate { grid-template-columns: 1fr minmax(88px, auto); }
  .rate .track { grid-column: 1 / -1; grid-row: 2; }
}
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = /*__IMPACT_DATA__*/null;
const HIGHLIGHTS = /*__IMPACT_HIGHLIGHTS__*/null;
const AB = /*__IMPACT_AB__*/null;

const app = document.getElementById("app");
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;
    if (k === "class") n.className = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null) continue;
    n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return n;
}
const svgNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs) {
  const n = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  return n;
}
// 16px 선 아이콘. 상태는 색만으로 전하지 않는다.
const ICONS = {
  check: "M3.5 8.5l3 3 6-7",
  down: "M8 3v10M4 9l4 4 4-4",
  alert: "M8 2.5l6 11H2zM8 7v3M8 12v.01",
  pause: "M6 4v8M10 4v8",
  dash: "M4 8h8",
  shield: "M8 2l5 2v4c0 3-2.2 5.2-5 6-2.8-.8-5-3-5-6V4z",
};
function icon(name, size = 14) {
  const s = sv("svg", { width: size, height: size, viewBox: "0 0 16 16", fill: "none", stroke: "currentColor",
    "stroke-width": 1.6, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" });
  s.append(sv("path", { d: ICONS[name] }));
  return s;
}
const fmt = (v, d = 1) => v == null ? "–" : (Number.isInteger(v) ? String(v) : Math.abs(v) >= 100 ? String(Math.round(v)) : v.toFixed(d));
const B = DATA ? DATA.periods.before : null, A = DATA ? DATA.periods.after : null;
const warnings = new Set((DATA && DATA.warnings) || []);
const beforeMissing = warnings.has("before_missing");
// 비교 가능성·추세·저장소 상태(scripts/impact-assess.jq). 보드 "하네스 효과"와 같은 값.
const AS = (DATA && DATA.assessment) || { metrics: {}, trends: {} };

// 숫자 옆에 붙는 신뢰도 경고. 아래 "신뢰도와 한계"에 같은 뜻을 길게 쓴다.
const CHIP = {
  model_shift: "모델이 바뀜",
  low_sample: "표본 적음",
  few_digests: "정리된 세션 적음",
  before_missing: "설치 전 기록 없음",
  rework_split: "이슈 분할 PR이 섞일 수 있음",
};
function chips(keys) {
  const ks = keys.filter(Boolean);
  return ks.length ? el("div", { class: "chips" }, ks.map(k => el("span", { class: "chip" }, icon("alert", 12), CHIP[k] || k))) : null;
}

function delta(lower, b, a, unit) {
  if (b == null || a == null) return { text: beforeMissing ? "설치 전 기록 없음" : "비교 불가", cls: "flat" };
  if (b === a) return { text: "변화 없음", cls: "flat" };
  if (lower === null) {
    const diff = a - b;
    return { text: (diff > 0 ? "▲ " : "▼ ") + fmt(Math.abs(diff)) + (unit || ""), cls: "flat" };
  }
  const pct = b === 0 ? null : Math.round(Math.abs(a - b) / b * 100);
  const better = lower ? a < b : a > b;
  return { text: (a < b ? "▼ " : "▲ ") + (pct == null ? "" : pct + "% ") + (better ? "개선" : "악화"), cls: better ? "good" : "bad" };
}

const IMPS = (DATA && DATA.improvements) || [];
const VERDICT = {
  gone: { label: "사라짐", icon: "check", text: "반영 뒤 같은 유형이 다시 나오지 않았어요" },
  reduced: { label: "줄어듦", icon: "down", text: "반영 뒤 같은 유형이 나오는 비율이 줄었어요" },
  recurred: { label: "재발", icon: "alert", text: "반영 뒤에도 같은 유형이 비슷하거나 더 자주 나왔어요" },
  hold: { label: "판단 보류", icon: "pause", text: "반영 뒤 정리된 세션이 적거나 반영 뒤 목록이 잘려 아직 판단하지 않아요" },
  no_baseline: { label: "기준 없음", icon: "dash", text: "근거 세션 정리에서 이 유형을 찾지 못해 비교할 기준이 없어요" },
  unmatched: { label: "판정 안 함", icon: "dash", text: "이번 리포트에서 이 개선의 패턴을 맞춰 보지 않았어요" },
};
const vcount = k => IMPS.filter(x => (x.result || {}).verdict === k).length;

function verdictLine() {
  const parts = [];
  if (IMPS.length) {
    const ok = vcount("gone") + vcount("reduced"), bad = vcount("recurred");
    const wait = IMPS.length - ok - bad;
    parts.push(el("span", {}, "반영한 개선 ", el("b", {}, IMPS.length + "건"), " 중 ",
      el("b", {}, "효과 확인 " + ok), " · ", el("b", {}, "재발 " + bad), " · 아직 판단 못 함 " + wait));
  }
  if (A.guard_blocks > 0) parts.push(el("span", {}, "최근 구간에 위험한 수정 ", el("b", {}, A.guard_blocks + "건"), "을 막았어요"));
  if (!parts.length) return null;
  const p = el("p", { class: "verdict" });
  parts.forEach((x, i) => { if (i) p.append(". "); p.append(x); });
  p.append(".");
  return p;
}

// 저장소 상태 한 줄: 신호가 있으면 신호, 없으면 왜 아직 모르는지.
const STATUS_LABEL = { effective: "효과 확인", mixed: "엇갈림", attention: "재발/악화", watching: "관찰 중", insufficient: "데이터 부족", no_sessions: "최근 세션 없음" };
function statusLine() {
  const st = AS.status;
  if (!st) return null;
  const M = { corrections_per_session: "교정", missing_context_per_session: "사실 부족", guard_blocks: "가드 차단", rework: "재작업 비율" };
  const say = (x, good) => x.by === "improvement" ? "개선 " + x.n + "건 " + (good ? "효과 있음" : "재발")
    : x.by === "trend" ? M[x.metric] + (good ? " 줄고" : " 늘고") + " 있음" : "설치 전보다 " + M[x.metric] + (good ? " 줄어듦" : " 늘어남");
  const GAP = {
    no_recent_sessions: () => "최근 구간에 세션이 없어요",
    no_baseline: () => "설치 전 기록이 없어 전후 비교 불가",
    few_recent_digests: () => "설치 후 정리된 세션이 적어 추세를 아직 못 봐요",
    no_improvements: () => "아직 /harvest가 반영한 개선이 없어요",
    unmatched_improvements: g => "개선 " + g.n + "건 아직 맞춰 보지 않음",
    few_observed: g => "개선 " + g.n + "건 반영 뒤 세션이 적어 관찰 중",
    no_baseline_improvements: g => "개선 " + g.n + "건은 근거에서 유형을 찾지 못해 비교 기준 없음",
  };
  const sig = [...st.good.map(x => say(x, true)), ...st.bad.map(x => say(x, false))];
  const text = sig.length ? sig.join(" · ") : st.gaps.map(g => GAP[g.why] ? GAP[g.why](g) : g.why).join(" · ");
  return el("p", { class: "verdict" }, el("b", {}, STATUS_LABEL[st.key] || st.key), " — ", text || "판단할 신호가 아직 없어요", ".");
}

function autoHeadline() {
  const ok = vcount("gone") + vcount("reduced");
  if (ok) return "하네스가 고친 실수 " + ok + "가지가 다시 나오지 않거나 줄었어요";
  const cb = B.corrections_per_session, ca = A.corrections_per_session;
  const cmp = (AS.metrics || {}).corrections_per_session;
  if ((AS.trends || {}).corrections_per_session && AS.trends.corrections_per_session.verdict === "down") return "설치 뒤 같은 지적이 줄고 있어요";
  if ((!cmp || cmp.comparable) && cb != null && ca != null && cb > 0 && ca < cb) return "같은 지적이 " + Math.round((cb - ca) / cb * 100) + "% 줄었어요";
  if (A.guard_blocks > 0) return "위험한 수정 " + A.guard_blocks + "건을 막았어요";
  return "도입 전후 변화를 정리했어요";
}

if (DATA) {
// 1. 판정
app.append(el("header", {},
  el("div", { class: "meta" }, DATA.project, " · 설치 ", DATA.installed.date,
    " · 설치 전 ", B.since, "~", B.until, " vs 최근 ", A.since, "~", A.until, " (각 ", DATA.window_days, "일, 끝 날짜 미포함)"),
  el("h1", {}, (HIGHLIGHTS && HIGHLIGHTS.headline) || autoHeadline()),
  verdictLine(),
  statusLine()));

// 2. 핵심 카드: 하네스가 직접 겨냥하는 세 가지.
// 비교 가능성과 추세는 집계(scripts/impact-assess.jq)가 정한 값이다 — 보드와 같은 값을 쓰고, 여기서 새 기준을 만들지 않는다.
const NOT_COMPARABLE = {
  no_baseline_sessions: "설치 전 세션 기록 없음",
  no_baseline_digests: "설치 전 기록 없음(세션 정리는 설치 뒤부터 쌓임)",
  few_digests: "정리된 세션이 적음 (양쪽 5개 이상일 때 비교)",
  few_prs: "정산된 PR이 적음 (양쪽 10개 이상일 때 비교)",
  no_rework: "계산 안 함",
  after_only: "설치 후에만 있는 지표 (가드는 하네스와 함께 깔림)",
  no_value: "값이 없음",
};
const TREND_WORD = { down: "줄고 있음", flat: "비슷함", up: "늘고 있음", insufficient: "데이터 부족" };
function trendLine(key) {
  const t = (AS.trends || {})[key];
  if (!t) return null;
  const word = TREND_WORD[t.verdict] || t.verdict;
  const cls = t.verdict === "down" ? "good" : t.verdict === "up" ? "bad" : "flat";
  return el("div", { class: "delta " + cls }, "설치 후 추세: ", word,
    t.verdict === "insufficient" ? " (정리된 세션 2개 이상인 주 " + t.weeks + "개 · " + t.digested + "세션, 3주·10세션부터 판단)"

    c.append(el("div", { class: "card" }, el("strong", {}, x.title), x.detail ? el("p", { class: "expected" }, x.detail) : null));
  }
  app.append(c);
}
{
  const col = (title, items) => el("div", { class: "card" }, el("h3", {}, title),
    items.length ? el("div", { class: "list" }, items.slice(0, 8).map(c =>
      el("div", { class: "row" }, el("span", { class: "when" }, c.date), el("span", { class: "what" }, c.summary))))
    : el("p", { class: "empty" }, "기록 없음"));
  const det = (title, pair) => el("details", {}, el("summary", {}, title, " (설치 전 ", pair.before.total, " · 최근 ", pair.after.total, ")"),
    el("div", { class: "cols", style: "margin-top: 8px" }, col("설치 전", pair.before.items), col("최근", pair.after.items)));
  app.append(det("사용자 교정 목록", DATA.corrections));
  if (DATA.missing_context) app.append(det("프로젝트 사실을 몰라 생긴 문제 목록", DATA.missing_context));
}

const rules = (DATA.timeline || []).filter(x => x.kind !== "harvest");
if (rules.length) {
  app.append(el("h3", { style: "margin: 24px 0 8px; font-size: 14px" }, "자동 적용된 규칙"));
  const t = el("div", { class: "card list" });
  for (const x of rules) {
    t.append(el("div", { class: "row" },
      el("span", { class: "when" }, x.date),
      el("span", { class: "what" }, x.summary || "", x.expected ? el("div", { class: "expected" }, "기대: ", x.expected) : null),
      el("span", { class: "tag" }, x.scope === "global" ? "전역 규칙" : "자동 규칙")));
  }
  app.append(t);
}

const ad = DATA.adoption;
app.append(el("h3", { style: "margin: 24px 0 8px; font-size: 14px" }, "도입 현황 (최근 구간)"));
app.append(el("div", { class: "card" },
  el("p", { style: "margin: 0 0 8px" }, "작업 세션 ", ad.active_sessions, "개 중 ", ad.harness_sessions,
    "개가 하네스 문서·워크플로를 사용했어요", ad.active_sessions ? " (" + Math.round(ad.harness_sessions * 100 / ad.active_sessions) + "%)." : "."),
  ad.top_docs.length ? el("div", { class: "list" }, ad.top_docs.map(d =>
    el("div", { class: "row" }, el("span", { class: "what" }, d.target), el("span", { class: "tag" }, d.n, "회")))) : null));

} else {
  app.append(el("header", {}, el("h1", {}, "하네스 유무 통제 실험")));
}
// 통제 실험 (A/B)
if (AB && (AB.cases || []).length) {
  const KIND = { correct: "기본 동작", project_rule: "프로젝트 규칙", convention: "컨벤션", process: "작업 절차" };
  const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
  const H = "harness", N = "bare";
  const arms = AB.cases.map(c => c.arms);
  const avg = k => { const xs = arms.map(a => a[k].mean_score).filter(v => v != null); return xs.length ? xs.reduce((x, y) => x + y, 0) / xs.length : null; };
  app.append(el("h2", {}, "통제 실험: 같은 과제, 하네스 있음 vs 없음"));
  app.append(el("p", { class: "sub" }, "같은 코드 저장소에 하네스 파일(AGENTS.md·.ai-harness/docs)만 있고 없게 해서, 같은 요청을 실제 에이전트로 ",
    AB.runs_per_arm, "회씩 돌리고 숨긴 검사로 채점했어요. 평균 통과율: 하네스 있음 ", pct(avg(H)), " · 없음 ", pct(avg(N)),
    " · 모델 ", AB.model, " · 비용 $", AB.total_cost_usd, AB.partial ? " · 비용 상한으로 일부만 실행" : ""));
  const legend = el("p", { class: "sub" },
    el("span", { class: "key", style: "background: var(--series)" }), "하네스 있음  ",
    el("span", { class: "key", style: "background: var(--series-2)" }), "하네스 없음");
  app.append(legend);
  const grid = el("div", { class: "abgrid" });
  for (const c of AB.cases) {
    const h = c.arms[H], n = c.arms[N];
    const bar = (label, v, color) => el("div", { class: "bar" }, el("span", {}, label),
      el("span", { class: "track" }, el("span", { class: "fill", style: "display:block; width:" + Math.round((v || 0) * 100) + "%; background: var(" + color + ")" })),
      el("span", { class: "pct" }, pct(v)));
    const names = [...new Set([...h.checks, ...n.checks].map(x => x.name))];
    const find = (arm, name) => arm.checks.find(x => x.name === name);
    const cell = x => x ? el("td", { class: x.passed === x.total ? "pass" : (x.passed === 0 ? "fail" : "") }, x.passed, "/", x.total) : el("td", {}, "–");
    const card = el("div", { class: "card" },
      el("strong", {}, c.name),
      el("div", { class: "bars" }, bar("하네스 있음", h.mean_score, "--series"), bar("하네스 없음", n.mean_score, "--series-2")),
      el("p", { class: "expected" }, "종류별 통과율 (있음 vs 없음) — ",
        ["basic", "project_rule", "convention", "process"].filter(k => (h.score_by_kind || {})[k] != null || (n.score_by_kind || {})[k] != null)
          .map(k => ({ basic: "기본 동작", project_rule: "프로젝트 규칙", convention: "컨벤션", process: "작업 절차" })[k] + " " + pct((h.score_by_kind || {})[k]) + " vs " + pct((n.score_by_kind || {})[k])).join(" · ")),
      el("p", { class: "expected" }, "모든 검사 통과 ", h.full_pass_runs, "/", h.scored_runs, "회 vs ", n.full_pass_runs, "/", n.scored_runs,
        "회 · 평균 턴 ", fmt(h.mean_turns), " vs ", fmt(n.mean_turns), " · 평균 비용 $", fmt(h.mean_cost_usd, 2), " vs $", fmt(n.mean_cost_usd, 2),
        (h.errors || n.errors) ? " · 오류로 점수에서 뺀 실행 " + h.errors + " / " + n.errors : ""),
      el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "검사"), el("th", {}, "종류"), el("th", {}, "있음"), el("th", {}, "없음"))),
        el("tbody", {}, names.map(name => {
          const a = find(h, name), b = find(n, name), k = (a || b).kind;
          return el("tr", {}, el("td", {}, name), el("td", {}, KIND[k] || k), cell(a), cell(b));
        }))));
    const failed = n.runs.filter(r => r.error == null && r.checks.some(x => !x.pass));
    if (failed.length) {
      const r = failed[0];
      card.append(el("details", {}, el("summary", {}, "하네스 없을 때 놓친 것 보기 (", r.run, "회차)"),
        el("ul", { class: "warn-list" }, r.checks.filter(x => !x.pass).map(x => el("li", {}, x.name, x.detail ? el("div", { class: "expected" }, x.detail) : null))),
        r.diff ? el("pre", {}, r.diff) : null));
    }
    grid.append(card);
  }
  app.append(grid);
  app.append(el("p", { class: "empty" }, "검사에는 하네스 문서에만 적힌 프로젝트 규칙이 들어 있어요. 이 실험은 \"그 규칙을 문서로 알려주면 지키는가\"를 보는 것이고, 모델의 일반 능력을 재는 것이 아니에요."));
}

if (DATA) {
// 신뢰도
const WARN_TEXT = {
  before_missing: "설치 전 기록이 없어요. transcript가 보관 기간(기본 30일) 뒤 지워졌을 수 있어요. 전후 비교 대신 개선별 성과와 설치 후 추이를 보세요.",
  short_window: "설치한 지 7일이 안 돼 비교 구간이 짧아요.",
  gap: "최근 구간과 설치일 사이에 기간이 있어요. 그 사이 변화는 주간 추이에서 보세요.",
  low_sample: "한쪽 구간의 작업 세션이 10개 미만이라 우연한 차이일 수 있어요.",
  few_digests: "LLM 세션 정리가 된 세션이 적어 교정·몰라서 생긴 문제 수치의 신뢰도가 낮아요.",
  model_shift: "두 구간에 주로 쓴 모델이 달라요. 턴·시간·토큰 차이에 모델 영향이 크게 섞여 있어요. 개선별 성과는 같은 시기끼리 비교라 영향이 작아요.",
};
app.append(el("h2", {}, "신뢰도와 한계"));
const models = p => Object.entries(p.models || {}).map(([k, v]) => k + " " + v).join(", ") || "–";
app.append(el("div", { class: "card" },
  el("ul", { class: "warn-list" },
    [...warnings].map(w => el("li", {}, WARN_TEXT[w] || w)),
    el("li", {}, "같은 기간에 작업 종류·팀 상황도 바뀌어요. 이 리포트는 변화를 보여줄 뿐 하네스가 원인이라고 증명하지 않아요."),
    el("li", {}, "개선별 성과의 \"같은 유형\"은 에이전트가 세션 정리 요약을 읽고 맞춘 것이에요. 맞춘 사례를 열어 직접 확인할 수 있어요."),
    el("li", {}, "모델 구성 — 전: ", models(B), " / 후: ", models(A)),
    el("li", {}, "LLM 정리된 세션 — 전 ", B.digested_sessions, " / 후 ", A.digested_sessions))));

}
app.append(el("footer", {}, "ai-harness harness-impact · 생성 ", (DATA && DATA.generated_at) || (AB && AB.generated_at) || "", " · 이 파일은 로컬 기록만으로 만들어졌고 외부로 전송되지 않았어요."));
</script>
