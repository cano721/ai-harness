/* ai-harness 디자인 토큰 — 값의 단일 출처. 규칙은 docs/design-system.md 에 있다.
   단일 HTML 화면(보드·리포트·기준 화면)에는 scripts/design-system.sh sync 가 이 파일을 그대로 넣는다.
   계층: --palette-* (원시 값, 의미 토큰만 참조) → --color-* 등 의미 토큰(화면·부품이 쓰는 이름).
   테마: OS 설정을 따르고, <html data-theme="light|dark"> 가 있으면 그쪽이 이긴다.
   다크 블록 두 개(@media, [data-theme="dark"])는 같은 내용이어야 한다 — design-system.sh contrast 가 검사한다. */
:root {
  color-scheme: light;

  /* 원시 값: 중립 16단(밝음 0 → 어두움 15), 상태 색상 5개 × 5단(1 옅은 면, 3 어두운 바탕용 글자, 5 경계, 7 밝은 바탕용 글자, 9 어두운 면) */
  --palette-gray-0: #ffffff;
  --palette-gray-1: #f5f7f9;
  --palette-gray-2: #edf0f4;
  --palette-gray-3: #e3e6eb;
  --palette-gray-4: #d6d9de;
  --palette-gray-5: #b9bec4;
  --palette-gray-6: #8d939a;
  --palette-gray-7: #7b8188;
  --palette-gray-8: #5e646b;
  --palette-gray-9: #484e55;
  --palette-gray-10: #33383f;
  --palette-gray-11: #23282e;
  --palette-gray-12: #1a1e24;
  --palette-gray-13: #13161b;
  --palette-gray-14: #0b0f13;
  --palette-gray-15: #06080b;
  --palette-orange-1: #ffefe7;
  --palette-orange-3: #eeac8b;
  --palette-orange-5: #cc6526;
  --palette-orange-7: #a44000;
  --palette-orange-9: #3a1e0f;
  --palette-blue-1: #eaf5ff;
  --palette-blue-3: #97c1f7;
  --palette-blue-5: #4087de;
  --palette-blue-7: #1762b6;
  --palette-blue-9: #15273e;
  --palette-violet-1: #f4f1ff;
  --palette-violet-3: #c1b3f2;
  --palette-violet-5: #8e71d6;
  --palette-violet-7: #6b4cae;
  --palette-violet-9: #28213c;
  --palette-green-1: #eaf8ec;
  --palette-green-3: #94cf9f;
  --palette-green-5: #2e9e52;
  --palette-green-7: #007329;
  --palette-green-9: #122d19;
  --palette-red-1: #ffeeec;
  --palette-red-3: #f2a7a1;
  --palette-red-5: #d15c56;
  --palette-red-7: #a83634;
  --palette-red-9: #3b1c1a;

  /* 면 */
  --color-surface-page: var(--palette-gray-1);
  --color-surface-sunken: var(--palette-gray-2);
  --color-surface: var(--palette-gray-0);
  --color-surface-overlay: var(--palette-gray-0);
  --color-surface-hover: var(--palette-gray-3);
  --color-surface-selected: var(--palette-gray-3);
  --color-backdrop: rgba(6, 8, 11, 0.45);

  /* 글자 */
  --color-text: var(--palette-gray-14);
  --color-text-muted: var(--palette-gray-8);
  --color-text-on-accent: var(--palette-gray-0);
  --color-text-on-solid: var(--palette-gray-0);

  /* 경계: border 는 구획용(대비 요구 없음), border-control 은 조작 요소의 윤곽(3:1) */
  --color-border: var(--palette-gray-4);
  --color-border-control: var(--palette-gray-7);

  /* 강조(주 동작·선택 표시)와 포커스 — 색이 아니라 명도로 구분한다 */
  --color-accent: var(--palette-gray-14);
  --color-accent-hover: var(--palette-gray-10);
  --color-focus: var(--palette-gray-14);

  /* 상태: 색 하나에 뜻 하나. 글자·아이콘 / 옅은 면 / 경계 / 채운 면 */
  --color-attention: var(--palette-orange-7);
  --color-attention-subtle: var(--palette-orange-1);
  --color-attention-border: var(--palette-orange-5);
  --color-attention-solid: var(--palette-orange-7);
  --color-progress: var(--palette-blue-7);
  --color-progress-subtle: var(--palette-blue-1);
  --color-progress-border: var(--palette-blue-5);
  --color-progress-solid: var(--palette-blue-7);
  --color-waiting: var(--palette-violet-7);
  --color-waiting-subtle: var(--palette-violet-1);
  --color-waiting-border: var(--palette-violet-5);
  --color-waiting-solid: var(--palette-violet-7);
  --color-success: var(--palette-green-7);
  --color-success-subtle: var(--palette-green-1);
  --color-success-border: var(--palette-green-5);
  --color-success-solid: var(--palette-green-7);
  --color-danger: var(--palette-red-7);
  --color-danger-subtle: var(--palette-red-1);
  --color-danger-border: var(--palette-red-5);
  --color-danger-solid: var(--palette-red-7);
  --color-info: var(--palette-gray-8);
  --color-info-subtle: var(--palette-gray-2);
  --color-info-border: var(--palette-gray-7);
  --color-info-solid: var(--palette-gray-8);

  /* 간격: 4px 기준 */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  /* 크기: 조작 요소 높이 사다리, 아이콘, 최소 누름 영역 */
  --size-control-sm: 24px;
  --size-control-md: 32px;
  --size-icon: 16px;
  --size-icon-sm: 14px;
  --size-badge: 20px;
  --size-dot: 8px;
  --size-row: 40px;
  --size-column-min: 280px;
  --size-target-min: 24px;
  --size-sidebar: 232px;
  --size-drawer: 480px;
  --size-content-max: 1100px;
  --size-toast-max: 420px;
  --size-viewport-min: 360px;

  /* 글자: 역할마다 크기·줄 높이·굵기 한 벌 */
  --font-family-sans: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-family-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-size-heading: 1.25rem;
  --font-line-heading: 1.35;
  --font-weight-heading: 600;
  --font-size-title: 0.9375rem;
  --font-line-title: 1.45;
  --font-weight-title: 600;
  --font-size-body: 0.875rem;
  --font-line-body: 1.6;
  --font-weight-body: 400;
  --font-size-label: 0.8125rem;
  --font-line-label: 1.4;
  --font-weight-label: 500;
  --font-size-caption: 0.75rem;
  --font-line-caption: 1.5;
  --font-weight-caption: 400;
  --font-size-code: 0.75rem;
  --font-line-code: 1.5;
  --font-weight-code: 400;
  --font-weight-strong: 600;

  /* 반경 */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 999px;

  /* 그림자: 뜬 면에만 */
  --shadow-overlay: 0 8px 28px rgba(6, 8, 11, 0.18);

  /* 층 */
  --z-sticky: 10;
  --z-drawer: 30;
  --z-popover: 40;
  --z-toast: 50;

  /* 모션 */
  --motion-duration-short: 120ms;
  --motion-duration-medium: 200ms;
  --motion-duration-long: 280ms;
  --motion-ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --motion-ease-enter: cubic-bezier(0, 0, 0.2, 1);
  --motion-ease-exit: cubic-bezier(0.4, 0, 1, 1);
  --motion-duration-loop: 1400ms;
  --motion-delay-loading: 300ms;

  /* 중단점: 미디어 쿼리는 변수를 못 쓰므로 components.css 가 같은 값을 직접 적는다 */
  --breakpoint-narrow: 760px;
  --breakpoint-wide: 1024px;
}

/* 이 화면의 기존 변수는 이름을 그대로 두고 값만 디자인 토큰에 잇는다(#287). 테마는 토큰이 바꾼다.
   부품을 docs/design-system/components.css 로 바꾸는 일은 보드 재구성 때 한다. */
:root {
  --bg: var(--color-surface-page); --side: var(--color-surface-sunken); --panel: var(--color-surface); --line: var(--color-border);
  --text: var(--color-text); --muted: var(--color-text-muted);
  --human: var(--color-attention); --human-bg: var(--color-attention-subtle); --run: var(--color-progress); --queue: var(--color-waiting);
  --block: var(--color-waiting); --done: var(--color-success); --chip: var(--color-info-subtle); --hover: var(--color-surface-hover); --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; }
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
aside { background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { font-weight: 700; font-size: 15px; padding: 0 8px; letter-spacing: -.01em; }
.navgroup h3 { margin: 0 8px 6px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.nav { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; color: var(--text);
  font: inherit; text-align: left; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
.nav:hover { background: var(--hover); }
.nav[aria-current="true"] { background: var(--panel); box-shadow: var(--shadow); font-weight: 600; }
.nav .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.badge { font-size: 11px; min-width: 20px; text-align: center; padding: 0 6px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.badge.alert { background: var(--human); color: var(--color-text-on-solid); }
.nav.proj { padding: 4px 8px; font-size: 13px; }
.sidefoot { margin-top: auto; font-size: 11px; color: var(--muted); padding: 0 8px; }
main { min-width: 0; padding: 20px 24px 32px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 4px; }
h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
.desc { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.board { display: grid; gap: 16px; align-items: start; }
@media (max-width: 1200px) { .board { grid-template-columns: 1fr 1fr !important; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; }
  main { padding: 16px; }
  .board { grid-template-columns: 1fr !important; }
}
.col { min-width: 0; }
.col h2 { font-size: 13px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.col h2 .dot { width: 8px; height: 8px; border-radius: 50%; }
.col h2 .n { color: var(--muted); font-weight: 500; }
.dot.needs_human { background: var(--human); } .dot.running { background: var(--run); } .dot.queued { background: var(--queue); }
.dot.blocked { background: var(--block); } .dot.done { background: var(--done); }
.dot.review { background: var(--run); box-shadow: 0 0 0 2px color-mix(in srgb, var(--run) 30%, transparent); } .dot.idle { background: var(--muted); }
.card[data-state="review"] { border-left-color: var(--run); }
.card[data-state="idle"] { border-left-color: var(--line); opacity: .85; }
.part { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); margin: 6px 0 2px; }
.part .n { font-weight: 400; }
.part button, .colbtn { margin-left: auto; font: inherit; font-size: 11px; font-weight: 400; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
.colbtn { margin: 4px 0; width: 100%; padding: 6px; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.refs a, .refs span { font-size: 11px; text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--text); background: var(--chip); }
.refs a:hover { border-color: var(--muted); }
.refs a.pr::before { content: "PR "; color: var(--muted); }
.refs a.jira::before, .refs span.jira::before { content: "Jira "; color: var(--muted); }
.chatnote .refs { margin-top: 0; }
.cardtools { display: flex; gap: 6px; margin-top: 8px; }
.cardtools button { font: inherit; font-size: 11px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.cardtools button:hover { color: var(--text); border-color: var(--muted); }
#cdlg .wt { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; word-break: break-all; }
#cdlg .wt pre { margin: 6px 0 0; font-size: 11px; white-space: pre-wrap; }
#cdlg .check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text); margin-top: 10px; }
#cdlg .check input { width: auto; }
.empty { color: var(--muted); font-size: 12px; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  margin-bottom: 10px; box-shadow: var(--shadow); border-left: 3px solid var(--line); }
.card[data-state="needs_human"] { border-left-color: var(--human); }
.card[data-state="running"] { border-left-color: var(--run); }
.card[data-state="queued"] { border-left-color: var(--queue); }
.card[data-state="blocked"] { border-left-color: var(--block); }
.card[data-state="done"] { border-left-color: var(--done); }
.card.group { background: var(--human-bg); }
.top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.kind { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--chip); color: var(--text); }
.proj { font-weight: 600; color: var(--text); }
.ago { margin-left: auto; }
.title { margin: 6px 0 0; font-weight: 600; }
.detail { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
.detail.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chips span { font-size: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.actions a, .actions button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent;
  color: var(--text); border-radius: 6px; padding: 3px 9px; text-decoration: none; cursor: pointer; }
.actions a.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.actions button.run { background: var(--run); color: var(--color-text-on-solid); border-color: var(--run); }
.card[data-state="queued"] .actions button.run { background: var(--queue); border-color: var(--queue); }
.card[data-state="needs_human"] .actions button.run { background: var(--human); border-color: var(--human); }
.actions button:disabled { opacity: .6; cursor: progress; }
.meta { color: var(--muted); font-size: 12px; }
.more { font-size: 12px; color: var(--muted); background: none; border: 0; padding: 4px 0 0; cursor: pointer; font: inherit; }

  <form method="dialog">
    <h3>세션 정리</h3>
    <p class="desc" id="cdesc"></p>
    <div class="wt" id="cwt"></div>
    <label class="check"><input type="checkbox" id="cwtbox"> <span id="cwtlabel">worktree도 삭제</span></label>
    <div class="row"><button value="cancel" formnovalidate>취소</button><button class="primary" value="ok">정리</button></div>
  </form>
</dialog>
<dialog id="sdlg">
  <form method="dialog" id="sform">
    <h3 id="stitle"></h3>
    <p class="desc">병합·배포 단계가 쓰는 저장소 사실입니다. 확인하면 이 저장소에서 /ai-harness:harness-init 설정 변경 세션이 돌아 harness.json을 고친 draft PR을 엽니다. 병합 여부·조건은 각자의 설정이라 여기서 바꾸지 않습니다.</p>
    <label for="sbase">기준 브랜치 (병합 대상)</label><input id="sbase" required>
    <label for="sdeploycmd">배포 확인 명령 — 배포된 커밋이 $HM_MERGE_COMMIT 과 같을 때 0으로 끝나야 함 (비우면 없음)</label>
    <input id="sdeploycmd" placeholder='scripts/deployed.sh "$HM_MERGE_COMMIT"'>
    <label for="ssmokecmd">스모크 명령 (비우면 없음)</label>
    <input id="ssmokecmd" placeholder="curl -fsS https://dv.example.com/health">
    <p class="note" id="snote"></p>
    <div class="row"><button value="cancel" formnovalidate>취소</button><button class="primary" value="ok">변경 PR 만들기</button></div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>
<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
  let data = JSON.parse(document.getElementById('data').textContent);
  const TOKEN = new URLSearchParams(location.search).get('t');
  const SERVER = data === null && !!TOKEN;

  // 메인 목록: 작업(세션)·하네스 동작(harvest·sync·규칙·스케줄)·자동 수정(에러 시그니처)을 같은 상태 열로 본다.
  const VIEWS = {
    list: {
      label: '작업 현황', sub: '작업 · 하네스 동작 · 자동 수정',
      cols: [
        { label: '사람 필요', parts: [{ state: 'needs_human', label: '답·검토가 필요함' }, { state: 'review', label: '결과 확인' }] },
        { state: 'running', label: '진행 중' },
        { label: '대기', parts: [{ state: 'queued', label: '대기' }, { state: 'blocked', label: '막힘' }] },
        { label: '완료·쉬는 중', parts: [{ state: 'done', label: '완료' }, { state: 'idle', label: '쉬는 중' }], collapsible: true },
      ],
    },
    settings: {
      label: '하네스 설정', sub: '내 자동화 단계', custom: true,
      desc: '에이전트가 PR 뒤 어디까지 스스로 갈지는 내 설정이라 바로 바뀝니다(다른 사람에게 영향 없음, 고르지 않으면 PR까지). 저장소별 단계가 내 기본보다 우선합니다. 저장소 harness.json은 에이전트가 커밋·PR을 해도 되는지와 기준 브랜치·배포·스모크 명령만 정하고 PR로 바꿉니다. 병합은 호스트가 기준 브랜치에 필수 승인을 걸어 둔 저장소에서만 일어납니다.',
      cols: [],
    },
    impact: {
      label: '하네스 효과', sub: '개선과 재발 여부', custom: true,
      desc: '저장소마다 하네스 효과가 있었는지, 아직 모르는지, 왜 모르는지를 봅니다 — 설치 후 교정·프로젝트 사실 부족의 추세, 하네스가 고친 것(/harvest가 반영한 개선)이 다시 나왔는지, 비교할 수 있을 때만 설치 전후 비교. 집계는 /ai-harness:harness-impact와 같은 impact.sh compare를 뒤에서 하루 한 번 돌린 결과입니다. 읽기 전용 — 보드는 개선을 되돌리거나 하네스를 고치지 않습니다.',
      cols: [],
    },
  };
  const TABS = [
    ['all', '전체', '작업 세션·하네스 동작·자동 수정을 한 목록으로. 카드의 출처 칩으로 구분합니다. 사람 필요 열이 지금 내가 할 일입니다.'],
    ['work', '작업', '이 맥에서 돌고 있는 Claude 세션 전체(어느 터미널이든). 카드를 누르면 대화가 실시간으로 보이고, 백그라운드 세션은 여기서 이어서 지시할 수 있음.'],
    ['harness', '하네스 동작', '하네스가 스스로 돌리는 harvest·sync·규칙 적용과 정기 실행. 사람 필요는 PR 검토나 직접 마무리가 필요한 것.'],
    ['autofix', '자동 수정', '/ai-harness:autofix가 고치거나 사람에게 넘긴 운영 에러(시그니처마다 한 장). 사람 필요는 넘김·포기·실패·PR 검토 대기, 진행 중은 수정·배포·재발 관찰, 완료는 해결·PR 닫힘·건너뜀. 화면은 LLM 없이 로컬 기록만 읽고, 보드는 수정 실행을 시작하거나 PR을 병합하지 않습니다.'],
  ];
  const SRC = { work: '작업', harness: '하네스', autofix: '자동 수정' };
  const KIND = { harvest: 'harvest', 'harvest-global': 'harvest 전역', sync: 'sync', runner: '워크플로', rule: '규칙', schedule: '스케줄', agent: '대화형', bg: '백그라운드', autofix: '에러' };
  const DRAWER_ACTIONS = ['view', 'send', 'cleanup'];
  const ACTION_LABEL = { harvest_now: 'harvest 지금 돌리기', open_agent: '세션으로 열기' };
  const CAUSE = {
    remote_blocked: {
      title: '원격 저장소 접근이 막혀 PR을 열지 못함',
      detail: '같은 원인으로 자동 sync가 멈췄습니다. 원격 호스트가 접속 위치(IP 허용 목록·VPN)나 권한으로 막고 있는지 확인한 뒤 다시 실행하세요.',
      cmd: '/ai-harness:harness-init --sync --apply',
    },
  };

  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  // 예전 보기(work·harness·autofix)는 목록의 탭으로 옮긴다.
  const savedView = store('hb-view');
  let view = ['settings', 'impact'].includes(savedView) ? savedView : 'list';
  let tab = ['work', 'harness', 'autofix'].includes(savedView) ? savedView : (TABS.some(([k]) => k === store('hb-tab')) ? store('hb-tab') : 'all');
  if (['work', 'harness', 'autofix'].includes(savedView)) { store('hb-view', 'list'); store('hb-tab', tab); }
  let filter = 'all';
  let openIdle = store('hb-idle') === '1';

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const ago = (iso) => {
    if (!iso) return '';
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (s < 3600) return `${Math.max(1, Math.round(s / 60))}분 전`;
    if (s < 86400) return `${Math.round(s / 3600)}시간 전`;
    return `${Math.round(s / 86400)}일 전`;
  };
  const toast = (msg, ok) => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.dataset.ok = String(ok); t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 5000);
  };
  const copyBtn = (label, value) => {
    const b = el('button', null, label); b.title = value;
    b.onclick = async () => { try { await navigator.clipboard.writeText(value); b.textContent = '복사됨'; setTimeout(() => (b.textContent = label), 1200); } catch (e) { prompt('복사', value); } };
    return b;
  };
  const prLabel = (url) => { const m = url && url.match(/pull-requests\/(\d+)|pull\/(\d+)/); return m ? `PR #${m[1] || m[2]}` : 'PR'; };
  const srcOf = (i) => i.section || 'harness';
  const inTab = (t) => data.items.filter((i) => t === 'all' || srcOf(i) === t);
  const humanCount = (list) => list.filter((i) => i.state === 'needs_human' || i.state === 'review').length;

  async function act(it, action, btn) {
    btn.disabled = true; const label = btn.textContent; btn.textContent = '실행 중…';
    try {
      const r = await fetch('/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: TOKEN, id: it.id, action }) });
      const res = await r.json();
      toast(res.message || (res.ok ? '완료' : '실패'), !!res.ok);
      if (res.ok) await refresh();
    } catch (e) { toast('서버 연결 실패: ' + e.message, false); }
    btn.disabled = false; btn.textContent = label;
  }
  // 누르는 도중에 다시 그리면 클릭이 사라진다 → 버튼을 뗀 뒤로 미룬다. 내용이 같으면 다시 그리지 않는다.
  let pressing = false, renderPending = false, lastSig = '';
  document.addEventListener('pointerdown', () => { pressing = true; }, true);
  document.addEventListener('pointerup', () => { pressing = false; if (renderPending) setTimeout(flush, 0); }, true);
  function flush() {
    if (pressing) { renderPending = true; return; }
    renderPending = false; renderAll(); if (selected) renderDrawerMeta();
  }
  async function refresh() {
    const r = await fetch('/status.json?t=' + encodeURIComponent(TOKEN), { cache: 'no-store' });
    const next = await r.json();
    const sig = JSON.stringify(next.items);
    if (sig === lastSig) return;
    lastSig = sig; data = next; flush();
  }

  async function markSeen(ids) {
    await fetch('/seen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: TOKEN, ids }) });
    data.items.forEach((i) => { if (ids.includes(i.id) && i.state === 'review') i.state = 'idle'; });
    lastSig = ''; renderAll();
  }
  function refsBox(it) {
    const r = it.refs; if (!r || (!r.prs.length && !r.issues.length)) return null;
    const box = el('div', 'refs');
    for (const u of r.prs) {
      const a = el('a', 'pr', u.match(/(?:pull-requests|pull)\/(\d+)/) ? `${u.split('/')[4]} #${u.match(/(\d+)$/)[1]}` : u);
      a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.title = u; a.onclick = (e) => e.stopPropagation(); box.append(a);
    }
    for (const k of r.issues) {
      if (data.jira_base) { const a = el('a', 'jira', k); a.href = `${data.jira_base}/browse/${encodeURIComponent(k)}`; a.target = '_blank'; a.rel = 'noopener'; a.onclick = (e) => e.stopPropagation(); box.append(a); }
      else box.append(el('span', 'jira', k));
    }
    return box;
  }
  function cardTools(it) {
    const box = el('div', 'cardtools');
    if (it.state === 'review') { const b = el('button', null, '읽음'); b.onclick = (e) => { e.stopPropagation(); markSeen([it.id]); }; box.append(b); }
    if ((it.actions || []).includes('cleanup')) { const b = el('button', null, '정리'); b.onclick = (e) => { e.stopPropagation(); openCleanup(it); }; box.append(b); }
    return box.childNodes.length ? box : null;
  }
  let cleaning = null;
  async function openCleanup(it) {
    cleaning = it;
    dr('cdesc').textContent = (it.live ? (it.kind === 'bg' ? '백그라운드 세션을 멈추고 ' : 'Orca 터미널을 닫아 세션을 끝내고 ') : '')
      + `"${it.title}"을 보드에서 숨깁니다. 대화 기록은 남아서 나중에 claude --resume 으로 다시 열 수 있습니다.`;
    const wt = dr('cwt'), box = dr('cwtbox');
    wt.textContent = 'worktree 확인 중…'; box.checked = false; box.disabled = true;
    dr('cdlg').showModal();
    try {
      const res = await (await fetch(`/cleanup-preview?t=${encodeURIComponent(TOKEN)}&id=${encodeURIComponent(it.id)}`)).json();
      const w = res.worktree || {};
      wt.replaceChildren(el('div', null, w.path || it.cwd || '?'), el('div', null, w.branch ? `브랜치 ${w.branch}` : ''));
      if (w.removable) { box.disabled = false; dr('cwtlabel').textContent = 'worktree도 삭제 (변경·미푸시 커밋 없음 확인됨)'; }
      else { dr('cwtlabel').textContent = 'worktree는 지우지 않음 — ' + (w.reason || '확인 실패'); }
      if (w.dirty) wt.append(el('pre', null, w.dirty.join('\n')));
    } catch (e) { wt.textContent = '확인 실패: ' + e.message; }
  }
  document.getElementById('cdlg').addEventListener('close', async () => {
    if (dr('cdlg').returnValue !== 'ok' || !cleaning) return;
    const res = await post({ id: cleaning.id, action: 'cleanup', worktree: dr('cwtbox').checked });
    toast(res.message, res.ok);
    if (res.ok) { if (selected === cleaning.id) closeDrawer(); lastSig = ''; refresh(); }
    cleaning = null;
  });
  function permBox(it) {
    const p = it.permission, box = el('div', 'perm');
    box.append(el('b', null, `권한 요청 · ${p.tool}`), el('pre', null, p.input));
    const row = el('div', 'row');
    for (const [decision, label] of [['allow', '허용'], ['deny', '거부']]) {
      const b = el('button', decision === 'allow' ? 'allow' : null, label);
      b.onclick = async (e) => {
        e.stopPropagation(); row.querySelectorAll('button').forEach((x) => (x.disabled = true));
        const res = await (await fetch('/permission', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ t: TOKEN, pid: p.pid, decision }) })).json();
        toast(res.message, res.ok); refresh();
      };
      row.append(b);
    }
    box.append(row);
    return box;
  }
  function card(it) {
    const c = el('article', 'card'); c.dataset.state = it.state;
    const top = el('div', 'top');
    if (view === 'list' && tab === 'all') top.append(el('span', `src ${srcOf(it)}`, SRC[srcOf(it)] || srcOf(it)));
    top.append(el('span', 'kind', it.kind === 'autofix' ? (it.stage_label || '에러') : (KIND[it.kind] || it.kind)), el('span', 'proj', it.project), el('span', 'ago', ago(it.at)));
    const tt = el('p', 'title', it.title); if (it.term && it.term !== it.title) tt.title = '터미널: ' + it.term;
    c.append(top, tt);
    if (it.kind === 'autofix') c.append(afCardMeta(it));
    if (it.detail) {
      const d = el('p', 'detail clamp', it.detail.replace(/\*\*/g, '').replace(/\\n/g, '\n'));
      c.append(d);
      if (it.detail.length > 140) {
        const m = el('button', 'more', '더 보기');
        m.onclick = () => { d.classList.toggle('clamp'); m.textContent = d.classList.contains('clamp') ? '더 보기' : '접기'; };
        c.append(m);
      }
    }
    const a = el('div', 'actions');
    if (SERVER) for (const action of (it.actions || []).filter((x) => !DRAWER_ACTIONS.includes(x))) {
      const b = el('button', 'run', ACTION_LABEL[action] || action);
      b.onclick = () => act(it, action, b);
      a.append(b);
    }
    if (it.link) { const l = el('a', it.state === 'needs_human' ? 'primary' : null, prLabel(it.link) + (it.state === 'needs_human' ? ' 검토' : '')); l.href = it.link; l.target = '_blank'; l.rel = 'noopener'; a.append(l); }
    if (it.cmd) a.append(copyBtn('명령 복사', it.cmd));
    if (it.log) a.append(copyBtn('로그 경로', it.log));
    if (it.path && !SERVER) a.append(copyBtn('경로 복사', it.path));
    if (it.cost != null) a.append(el('span', 'meta', `$${it.cost.toFixed(2)} · ${Math.round((it.duration_s || 0) / 60)}분`));
    if (a.childNodes.length) c.append(a);
    if (it.subagents) c.append(el('div', 'subs', subsLabel(it.subagents)));
    if (SERVER && it.permission) c.append(permBox(it));
    { const r = refsBox(it); if (r) c.append(r); }
    if (SERVER) { const t = cardTools(it); if (t) c.append(t); }
    if (SERVER && (it.actions || []).includes('view')) {
      c.classList.add('clickable');
      if (selected === it.id) c.classList.add('selected');
      c.addEventListener('click', (e) => { if (!e.target.closest('button, a')) openDrawer(it); });
    }
    return c;
  }

  let selected = null, pollTimer = null;
  const dr = (id) => document.getElementById(id);
  async function post(body) {
    const r = await fetch('/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: TOKEN, ...body }) });
    return r.json();
  }
  let offset = 0, current = null;
  const addMsg = (m) => { const d = el('div', 'msg ' + m.role, m.text); dr('dchat').append(d); };
  // 요청은 한 번에 하나만. 응답이 늦어 다음 폴링이 같은 위치에서 또 출발하면 같은 메시지가 겹쳐 붙는다.
  let polling = false;
  async function pollChat() {
    if (!selected || polling) return;
    polling = true;
    const id = selected, from = offset;
    try {
      const r = await fetch(`/transcript?t=${encodeURIComponent(TOKEN)}&id=${encodeURIComponent(id)}&offset=${from}`, { cache: 'no-store' });
      const res = await r.json();
      if (id !== selected || from !== offset) return;   // 그사이 다른 세션을 열었거나 위치가 바뀜 → 버린다
      if (!res.ok) { dr('dchat').replaceChildren(el('div', 'msg tool', res.message)); return; }
      const chat = dr('dchat');
      const atBottom = res.reset || chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60;
      if (res.reset) { chat.replaceChildren(); topOffset = res.start; olderBusy = false; if (topOffset === 0) chat.append(el('div', 'chatedge', '대화 처음')); }
      res.messages.forEach(addMsg);
      offset = res.offset;
      renderQuestion(res.question);
      if (atBottom) chat.scrollTop = chat.scrollHeight;
    } catch (e) {} finally { polling = false; }
  }
  // 위로 끝까지 올리면 이전 대화를 한 페이지씩 앞에 붙인다(보던 위치는 그대로)
  let topOffset = 0, olderBusy = false;
  async function loadOlder() {
    if (olderBusy || !selected || topOffset <= 0) return;
    olderBusy = true;
    const chat = dr('dchat'), id = selected;
    const marker = el('div', 'chatedge', '이전 대화 불러오는 중…'); chat.prepend(marker);
    try {
      const r = await fetch(`/transcript?t=${encodeURIComponent(TOKEN)}&id=${encodeURIComponent(id)}&before=${topOffset}`, { cache: 'no-store' });
      const res = await r.json();
      if (id !== selected || !res.ok) return;
      const h = chat.scrollHeight;
      const frag = document.createDocumentFragment();
      if (res.start === 0) frag.append(el('div', 'chatedge', '대화 처음'));
      res.messages.forEach((m) => frag.append(el('div', 'msg ' + m.role, m.text)));
      marker.remove(); chat.prepend(frag);
      chat.scrollTop += chat.scrollHeight - h;
      topOffset = res.start;
    } catch (e) {} finally { marker.remove(); olderBusy = false; }
  }
  dr('dchat').addEventListener('scroll', () => { if (dr('dchat').scrollTop < 80) loadOlder(); });
  let qKey = null;
  function renderQuestion(qs) {
    const box = dr('dq');
    const canSend = current && (current.actions || []).includes('send');
    const key = qs && canSend ? JSON.stringify(qs) : null;
    if (key === qKey) return;
    qKey = key; box.replaceChildren(); box.hidden = !key;
    if (!key) return;
    const picks = qs.map(() => new Set());
    const single = qs.length === 1 && !qs[0].multiSelect;
    const sendBtn = el('button', null, '답 보내기'); sendBtn.type = 'button'; sendBtn.disabled = true;
    const submit = async () => {
      const text = qs.map((q, i) => `${q.question} → ${[...picks[i]].join(', ')}`).join('\n');
      box.querySelectorAll('button').forEach((b) => (b.disabled = true));
      const res = await post({ id: selected, action: 'send', text: '질문 답변:\n' + text });
      toast(res.message, res.ok);

  const cmdCache = {};
  async function commands(cwd) {

  function autocomplete(ta, cwdOf) {
    const pop = el('div', 'ac'); pop.hidden = true; pop.setAttribute('role', 'listbox'); ta.parentElement.append(pop);
    let list = [], idx = 0;
    const close = () => { pop.hidden = true; list = []; };
    const pick = (i) => { ta.value = list[i].name + ' '; close(); ta.focus(); };
    const draw = () => {
      pop.replaceChildren();
      list.forEach((c, i) => {
        const d = el('div'); d.setAttribute('role', 'option'); d.setAttribute('aria-selected', String(i === idx));
        d.append(el('b', null, c.name)); if (c.description) d.append(el('span', null, c.description));
        d.onmousedown = (e) => { e.preventDefault(); pick(i); };
        pop.append(d);
      });
      pop.hidden = !list.length;
      pop.children[idx]?.scrollIntoView({ block: 'nearest' });
    };
    ta.addEventListener('input', async () => {
      const m = ta.value.match(/^\/([\w:.-]*)$/);
      if (!m) return close();
      const q = m[1].toLowerCase();
      const all = await commands(cwdOf());
      list = all.filter((c) => c.name.slice(1).toLowerCase().includes(q))
        .sort((a, b) => a.name.slice(1).toLowerCase().startsWith(q) === b.name.slice(1).toLowerCase().startsWith(q) ? 0 : a.name.slice(1).toLowerCase().startsWith(q) ? -1 : 1)
        .slice(0, 30);
      idx = 0; draw();
    });
    ta.addEventListener('keydown', (e) => {
      if (pop.hidden || e.isComposing) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); idx = (idx + (e.key === 'ArrowDown' ? 1 : list.length - 1)) % list.length; draw(); }
      else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopImmediatePropagation(); pick(idx); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    }, true);
    ta.addEventListener('blur', () => setTimeout(close, 100));
  }

  function renderBoard() {

    const wgroups = {};

    const fill = (sec, state) => {
      const mine = items.filter((i) => i.state === state);
      const gl = Object.values(wgroups).filter((l) => groupState(l) === state);
      const singles = mine.filter((i) => !(srcOf(i) === 'work' && i.group));
      if (!singles.length && !gl.length) { sec.append(el('div', 'empty', state === 'needs_human' ? '확인할 것 없음' : '없음')); return; }
      for (const list of gl) sec.append(workGroupCard(list));

    // 열·칸에 실제로 그려질 카드 수: 묶이지 않은 카드 + 그 상태로 판정된 작업 묶음(묶음 상태는 groupState가 다시 정한다).
    const shown = (st) => items.filter((i) => i.state === st && !(srcOf(i) === 'work' && i.group)).length

        { placeholder: '예: 20', unit: '회', label: '하루 상한(회) 직접 입력' }),
      [`하루에 시작하는 수정 실행 수(전체 저장소 합계, 0이면 하루 0회). 오늘 ${adata.today.started}회 시작함.`,
        ...(C.daily_unlimited ? [el('span', 'warn', '제한 없음 — 새 에러마다 LLM 수정 실행이 돌아 하루 비용이 크게 늘 수 있습니다.')] : [])]));
    box.append(afRow('에러당 PR 상한', 'HM_AUTOFIX_MAX_ATTEMPTS',
      afLadder(C.max_attempts, withCur([[1, '1개'], [2, '2개 (기본)'], [3, '3개'], [5, '5개']], C.max_attempts, (n) => `${n}개`), (k) => afConfigure({ max_attempts: k })),
      ['같은 에러가 고친 뒤 다시 나오면 이 수만큼만 다시 고치고, 넘으면 포기로 남겨 사람에게 넘깁니다.']));
    box.append(afRow('실행당 예산', 'HM_AUTOFIX_BUDGET_USD',
      afPick(bcur, [[2, '$2'], [5, '$5'], [10, '$10 (기본)'], [20, '$20'], ['unlimited', '제한 없음']], (k) => afConfigure({ budget_usd: k }),
        { placeholder: '예: 15, 2.5', unit: '달러', label: '실행당 예산(달러) 직접 입력', mode: 'decimal' }),
      [`수정 실행 한 번(에러 1건)의 Claude 비용 상한(--max-budget-usd). 지금까지 누적 ${usd(adata.cost_usd)}.`,
        ...(bcur === 'unlimited' ? [el('span', 'warn', '제한 없음 — 수정 실행에 비용 상한을 넘기지 않아 한 실행이 길어지면 비용이 크게 늘 수 있습니다(시간 제한만 남음).')] : [])]));
  }

  function renderAll() { renderSidebar(); renderBoard(); }

  if (SERVER) {
    setInterval(() => { if (((view === 'list' && tab === 'autofix') || (view === 'settings' && stab === 'autofix')) && !document.hidden) loadAutofix(false); }, 15000);
    refresh().then(() => { loadSettings(true); loadAutofix(true); }).catch((e) => toast('상태를 읽지 못함: ' + e.message, false)); setInterval(() => refresh().catch(() => {}), 5000);
    setInterval(() => { if (view === 'impact' && !document.hidden) loadImpact(false); }, 4000);
    // 뒤에 있던 탭으로 돌아오면 바로 새로 읽는다(뒤 탭 타이머는 브라우저가 늦춰서 화면이 낡아 있을 수 있음)
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh().catch(() => {}); });
  }
  else renderAll();
})();
</script>
</body>
</html>
