<style>

}

.icard p { margin: 4px 0 0; color: var(--muted); font-size: 12px; word-break: break-word; }
.icard p.one { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icard p.ifacts { color: var(--text); }
.icard p.ihint { margin-top: 6px; }
.icard p.raw { white-space: pre-wrap; color: var(--text); }
.icard a { color: var(--run); }
.icard details { margin-top: 6px; font-size: 12px; color: var(--muted); }
.icard details summary { cursor: pointer; }
.icard details ul { margin: 4px 0 0; padding-left: 16px; }
.vbadge { flex: none; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; margin-top: 1px; }
.vbadge.gone, .vbadge.reduced { color: var(--done); border-color: var(--done); }
.vbadge.recurred { color: var(--human); border-color: var(--human); }
.vbadge.hold { color: var(--run); border-color: var(--run); }
.iquiet > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); margin: 4px 0 12px; }
.afwrap { grid-column: 1 / -1; }
.afwrap .ihead .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.afwrap .ilist li { grid-template-columns: 92px minmax(0, 1fr) auto; }
.afwrap .ilist b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.afwrap .isumtop .acts { display: flex; gap: 6px; margin-top: 8px; }
.afwrap .isumtop .acts button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.srow.afset { grid-template-columns: minmax(150px, .9fr) auto minmax(180px, 1.2fr); }
@media (max-width: 1100px) { .srow.afset { grid-template-columns: 1fr; gap: 8px; } }
.srow.afset > .ladder, .aftargets .ladder { justify-self: start; }
.aftargets { display: grid; grid-template-columns: minmax(0, auto) auto; gap: 6px 12px; align-items: center; font-size: 13px; }
.aftargets small { display: block; color: var(--muted); font-size: 11px; }
.afsteps { display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center; font-size: 11px; color: var(--muted); margin-top: 4px; }
.afsteps span.on { color: var(--text); font-weight: 600; }
.afsteps span.sep { opacity: .5; }
.afrun { display: grid; grid-template-columns: 7.5em minmax(0, 8em) minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
.afrun > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.afrun .dim, .afnote { color: var(--muted); font-size: 12px; }
.afrun a { color: var(--run); }
@media (max-width: 760px) { .afrun { grid-template-columns: auto 1fr; } .afrun > span:nth-child(n+3) { grid-column: 1 / -1; } }
#toast { position: fixed; right: 20px; bottom: 20px; max-width: 420px; padding: 10px 14px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: 13px; }
#toast[data-ok="true"] { border-left: 3px solid var(--done); }
#toast[data-ok="false"] { border-left: 3px solid var(--human); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Harness Board</div>
    <div class="navgroup" id="views"></div>
    <div class="navgroup"><h3>프로젝트</h3><div id="projects"></div></div>
    <div class="sidefoot" id="foot"></div>
  </aside>
  <main>
    <div class="head"><h1 id="vtitle"></h1><span class="meta" id="vmeta"></span><button class="newbtn" id="newbtn" hidden>+ 새 세션</button></div>
    <p class="desc" id="vdesc"></p>
    <div class="board" id="board"></div>
  </main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="세션 대화">
  <div class="dhead">
    <div class="t"><b id="dtitle"></b><span id="dsub"></span></div>
    <button id="dclose" aria-label="닫기">닫기</button>
  </div>
  <div class="chat" id="dchat"></div>
  <div id="dperm"></div>
  <div class="qbox" id="dq" hidden></div>
  <div class="chatnote" id="dnote"></div>
  <form class="compose" id="dform">
    <div class="acwrap"><textarea id="dinput" placeholder="이어서 지시 · /로 스킬 (Enter 전송 · Shift+Enter 줄바꿈)"></textarea></div>
    <button type="submit" id="dsend">보내기</button>
  </form>
</aside>
<dialog id="dlg">
  <form method="dialog">
    <h3>새 세션 (claude 백그라운드)</h3>
    <label for="fcwd">작업 경로</label>
    <input id="fcwd" list="repos" required placeholder="/path/to/repo">
    <datalist id="repos"></datalist>
    <label for="fname">이름 (선택)</label>
    <input id="fname" placeholder="예: NJ-1234 버그 확인">
    <label for="fprompt">첫 지시</label>
    <div class="acwrap"><textarea id="fprompt" required placeholder="/로 시작하면 스킬·명령 자동완성"></textarea></div>
    <div class="row"><button value="cancel" formnovalidate>취소</button><button class="primary" value="ok">띄우기</button></div>
  </form>
</dialog>
<dialog id="cdlg">
  <form method="dialog">
    <h3>세션 정리</h3>
    <p class="desc" id="cdesc"></p>
    <div class="wt" id="cwt"></div>
    <label class="check"><input type="checkbox" id="cwtbox"> <span id="cwtlabel">worktree도 삭제</span></label>
    <div class="row"><button value="cancel" formnovalidate>취소</button><button class="primary" value="ok">정리</button></div>
  </form>
</dialog>
<dialog id="sdlg">
  <form method="dialog" id="sform">
    <h3 id="stitle"></h3>
    <p class="desc">병합·배포 단계가 쓰는 저장소 사실입니다. 확인하면 이 저장소에서 /ai-harness:harness-init 설정 변경 세션이 돌아 harness.json을 고친 draft PR을 엽니다. 병합 여부·조건은 각자의 설정이라 여기서 바꾸지 않습니다.</p>
    <label for="sbase">기준 브랜치 (병합 대상)</label><input id="sbase" required>
    <label for="sdeploycmd">배포 확인 명령 — 배포된 커밋이 $HM_MERGE_COMMIT 과 같을 때 0으로 끝나야 함 (비우면 없음)</label>
    <input id="sdeploycmd" placeholder='scripts/deployed.sh "$HM_MERGE_COMMIT"'>
    <label for="ssmokecmd">스모크 명령 (비우면 없음)</label>
    <input id="ssmokecmd" placeholder="curl -fsS https://dv.example.com/health">
    <p class="note" id="snote"></p>
    <div class="row"><button value="cancel" formnovalidate>취소</button><button class="primary" value="ok">변경 PR 만들기</button></div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>
<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
  let data = JSON.parse(document.getElementById('data').textContent);
  const TOKEN = new URLSearchParams(location.search).get('t');
  const SERVER = data === null && !!TOKEN;

  const VIEWS = {
    work: {
      label: '작업', sub: '내가 시킨 에이전트 세션',
      desc: '이 맥에서 돌고 있는 Claude 세션 전체(어느 터미널이든). 카드를 누르면 대화가 실시간으로 보이고, 백그라운드 세션은 여기서 이어서 지시할 수 있음.',
      cols: [
        { label: '내 차례', parts: [{ state: 'needs_human', label: '답해야 함' }, { state: 'review', label: '결과 확인' }] },
        { state: 'running', label: '작업 중' },
        { state: 'idle', label: '쉬는 중', collapsible: true },
      ],
    },
    harness: {
      label: '하네스 동작', sub: '자동 개선 · 동기화 · 스케줄',
      desc: '하네스가 스스로 돌리는 harvest·sync·규칙 적용과 정기 실행. 사람 필요는 PR 검토나 직접 마무리가 필요한 것.',
      cols: [
        { state: 'needs_human', label: '사람 필요' },
        { state: 'queued', label: '대기' },
        { state: 'running', label: '진행 중' },
        { state: 'blocked', label: '막힘' },
        { state: 'done', label: '완료' },
      ],
    },
    settings: {
      label: '하네스 설정', sub: '내 자동화 단계', custom: true,
      desc: '에이전트가 PR 뒤 어디까지 스스로 갈지는 내 설정이라 바로 바뀝니다(다른 사람에게 영향 없음, 고르지 않으면 PR까지). 저장소별 단계가 내 기본보다 우선합니다. 저장소 harness.json은 에이전트가 커밋·PR을 해도 되는지와 기준 브랜치·배포·스모크 명령만 정하고 PR로 바꿉니다. 병합은 호스트가 기준 브랜치에 필수 승인을 걸어 둔 저장소에서만 일어납니다.',
      cols: [],
    },
    impact: {
      label: '하네스 효과', sub: '개선과 재발 여부', custom: true,
      desc: '저장소마다 하네스 효과가 있었는지, 아직 모르는지, 왜 모르는지를 봅니다 — 설치 후 교정·프로젝트 사실 부족의 추세, 하네스가 고친 것(/harvest가 반영한 개선)이 다시 나왔는지, 비교할 수 있을 때만 설치 전후 비교. 집계는 /ai-harness:harness-impact와 같은 impact.sh compare를 뒤에서 하루 한 번 돌린 결과입니다. 읽기 전용 — 보드는 개선을 되돌리거나 하네스를 고치지 않습니다.',
      cols: [],
    },
    autofix: {
      label: '자동 수정', sub: '운영 에러 수정·검증', custom: true,
      desc: '/ai-harness:autofix가 모니터링 도구의 에러를 고친 draft PR과, 병합·배포 뒤 같은 에러가 다시 나오는지 확인한 결과를 봅니다. 화면 보기·상태 표시는 LLM 없이 로컬 기록만 읽습니다. 접근 확인·후보 조회는 모니터링 도구 API를 부르므로 버튼을 눌렀을 때만 돌고 결과를 남겨 둡니다. 보드는 수정 실행을 시작하거나 PR을 병합하지 않습니다.',
      cols: [],
    },
  };
  const KIND = { harvest: 'harvest', 'harvest-global': 'harvest 전역', sync: 'sync', runner: '워크플로', rule: '규칙', schedule: '스케줄', agent: '대화형', bg: '백그라운드' };
  const DRAWER_ACTIONS = ['view', 'send', 'cleanup'];
  const ACTION_LABEL = { harvest_now: 'harvest 지금 돌리기', open_agent: '세션으로 열기' };
  const CAUSE = {
    remote_blocked: {
      title: '원격 저장소 접근이 막혀 PR을 열지 못함',
      detail: '같은 원인으로 자동 sync가 멈췄습니다. 원격 호스트가 접속 위치(IP 허용 목록·VPN)나 권한으로 막고 있는지 확인한 뒤 다시 실행하세요.',
      cmd: '/ai-harness:harness-init --sync --apply',
    },
  };

  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  let view = ['harness', 'settings', 'impact', 'autofix'].includes(store('hb-view')) ? store('hb-view') : 'work';
  let filter = 'all';
  let openIdle = store('hb-idle') === '1';

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const ago = (iso) => {
    if (!iso) return '';
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (s < 3600) return `${Math.max(1, Math.round(s / 60))}분 전`;
    if (s < 86400) return `${Math.round(s / 3600)}시간 전`;
    return `${Math.round(s / 86400)}일 전`;
  };
  const toast = (msg, ok) => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.dataset.ok = String(ok); t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 5000);
  };
  const copyBtn = (label, value) => {
    const b = el('button', null, label); b.title = value;
    b.onclick = async () => { try { await navigator.clipboard.writeText(value); b.textContent = '복사됨'; setTimeout(() => (b.textContent = label), 1200); } catch (e) { prompt('복사', value); } };
    return b;
  };
  const prLabel = (url) => { const m = url && url.match(/pull-requests\/(\d+)|pull\/(\d+)/); return m ? `PR #${m[1] || m[2]}` : 'PR'; };
  const inView = (v) => data.items.filter((i) => (i.section || 'harness') === v);

  async function act(it, action, btn) {
    btn.disabled = true; const label = btn.textContent; btn.textContent = '실행 중…';
    try {
      const r = await fetch('/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: TOKEN, id: it.id, action }) });
      const res = await r.json();
      toast(res.message || (res.ok ? '완료' : '실패'), !!res.ok);
      if (res.ok) await refresh();
    } catch (e) { toast('서버 연결 실패: ' + e.message, false); }
    btn.disabled = false; btn.textContent = label;
  }
  // 누르는 도중에 다시 그리면 클릭이 사라진다 → 버튼을 뗀 뒤로 미룬다. 내용이 같으면 다시 그리지 않는다.
  let pressing = false, renderPending = false, lastSig = '';
  document.addEventListener('pointerdown', () => { pressing = true; }, true);
  document.addEventListener('pointerup', () => { pressing = false; if (renderPending) setTimeout(flush, 0); }, true);
  function flush() {
    if (pressing) { renderPending = true; return; }
    renderPending = false; renderAll(); if (selected) renderDrawerMeta();
  }
  async function refresh() {
    const r = await fetch('/status.json?t=' + encodeURIComponent(TOKEN), { cache: 'no-store' });
    const next = await r.json();
    const sig = JSON.stringify(next.items);
    if (sig === lastSig) return;
    lastSig = sig; data = next; flush();
  }

  async function markSeen(ids) {
    await fetch('/seen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: TOKEN, ids }) });
    data.items.forEach((i) => { if (ids.includes(i.id) && i.state === 'review') i.state = 'idle'; });
    lastSig = ''; renderAll();
  }
  function refsBox(it) {
    const r = it.refs; if (!r || (!r.prs.length && !r.issues.length)) return null;
    const box = el('div', 'refs');
    for (const u of r.prs) {
      const a = el('a', 'pr', u.match(/(?:pull-requests|pull)\/(\d+)/) ? `${u.split('/')[4]} #${u.match(/(\d+)$/)[1]}` : u);
      a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.title = u; a.onclick = (e) => e.stopPropagation(); box.append(a);
    }
    for (const k of r.issues) {
      if (data.jira_base) { const a = el('a', 'jira', k); a.href = `${data.jira_base}/browse/${encodeURIComponent(k)}`; a.target = '_blank'; a.rel = 'noopener'; a.onclick = (e) => e.stopPropagation(); box.append(a); }
      else box.append(el('span', 'jira', k));
    }
    return box;
  }
  function cardTools(it) {
    const box = el('div', 'cardtools');
    if (it.state === 'review') { const b = el('button', null, '읽음'); b.onclick = (e) => { e.stopPropagation(); markSeen([it.id]); }; box.append(b); }
    if ((it.actions || []).includes('cleanup')) { const b = el('button', null, '정리'); b.onclick = (e) => { e.stopPropagation(); openCleanup(it); }; box.append(b); }
    return box.childNodes.length ? box : null;
  }
  let cleaning = null;
  async function openCleanup(it) {
    cleaning = it;
    dr('cdesc').textContent = (it.live ? (it.kind === 'bg' ? '백그라운드 세션을 멈추고 ' : 'Orca 터미널을 닫아 세션을 끝내고 ') : '')
      + `"${it.title}"을 보드에서 숨깁니다. 대화 기록은 남아서 나중에 claude --resume 으로 다시 열 수 있습니다.`;
    const wt = dr('cwt'), box = dr('cwtbox');
    wt.textContent = 'worktree 확인 중…'; box.checked = false; box.disabled = true;
    dr('cdlg').showModal();
    try {
      const res = await (await fetch(`/cleanup-preview?t=${encodeURIComponent(TOKEN)}&id=${encodeURIComponent(it.id)}`)).json();
      const w = res.worktree || {};
      wt.replaceChildren(el('div', null, w.path || it.cwd || '?'), el('div', null, w.branch ? `브랜치 ${w.branch}` : ''));
      if (w.removable) { box.disabled = false; dr('cwtlabel').textContent = 'worktree도 삭제 (변경·미푸시 커밋 없음 확인됨)'; }
      else { dr('cwtlabel').textContent = 'worktree는 지우지 않음 — ' + (w.reason || '확인 실패'); }
      if (w.dirty) wt.append(el('pre', null, w.dirty.join('\n')));
    } catch (e) { wt.textContent = '확인 실패: ' + e.message; }
  }
  document.getElementById('cdlg').addEventListener('close', async () => {
    if (dr('cdlg').returnValue !== 'ok' || !cleaning) return;
    const res = await post({ id: cleaning.id, action: 'cleanup', worktree: dr('cwtbox').checked });
    toast(res.message, res.ok);
    if (res.ok) { if (selected === cleaning.id) closeDrawer(); lastSig = ''; refresh(); }
    cleaning = null;
  });
  function permBox(it) {
    const p = it.permission, box = el('div', 'perm');
    box.append(el('b', null, `권한 요청 · ${p.tool}`), el('pre', null, p.input));
    const row = el('div', 'row');
    for (const [decision, label] of [['allow', '허용'], ['deny', '거부']]) {
      const b = el('button', decision === 'allow' ? 'allow' : null, label);
      b.onclick = async (e) => {
        e.stopPropagation(); row.querySelectorAll('button').forEach((x) => (x.disabled = true));
        const res = await (await fetch('/permission', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ t: TOKEN, pid: p.pid, decision }) })).json();
        toast(res.message, res.ok); refresh();
      };
      row.append(b);
    }
    box.append(row);
    return box;
  }
  function card(it) {
    const c = el('article', 'card'); c.dataset.state = it.state;
    const top = el('div', 'top');
    top.append(el('span', 'kind', KIND[it.kind] || it.kind), el('span', 'proj', it.project), el('span', 'ago', ago(it.at)));
    const tt = el('p', 'title', it.title); if (it.term && it.term !== it.title) tt.title = '터미널: ' + it.term;
    c.append(top, tt);
    if (it.detail) {
      const d = el('p', 'detail clamp', it.detail.replace(/\*\*/g, '').replace(/\\n/g, '\n'));
      c.append(d);
      if (it.detail.length > 140) {
        const m = el('button', 'more', '더 보기');
        m.onclick = () => { d.classList.toggle('clamp'); m.textContent = d.classList.contains('clamp') ? '더 보기' : '접기'; };
        c.append(m);
      }
    }
    const a = el('div', 'actions');
    if (SERVER) for (const action of (it.actions || []).filter((x) => !DRAWER_ACTIONS.includes(x))) {
      const b = el('button', 'run', ACTION_LABEL[action] || action);
      b.onclick = () => act(it, action, b);
      a.append(b);
    }
    if (it.link) { const l = el('a', it.state === 'needs_human' ? 'primary' : null, prLabel(it.link) + (it.state === 'needs_human' ? ' 검토' : '')); l.href = it.link; l.target = '_blank'; l.rel = 'noopener'; a.append(l); }
    if (it.cmd) a.append(copyBtn('명령 복사', it.cmd));
    if (it.log) a.append(copyBtn('로그 경로', it.log));
    if (it.path && !SERVER) a.append(copyBtn('경로 복사', it.path));
    if (it.cost != null) a.append(el('span', 'meta', `$${it.cost.toFixed(2)} · ${Math.round((it.duration_s || 0) / 60)}분`));
    if (a.childNodes.length) c.append(a);

  function autocomplete(ta, cwdOf) {
    const pop = el('div', 'ac'); pop.hidden = true; pop.setAttribute('role', 'listbox'); ta.parentElement.append(pop);

    const close = () => { pop.hidden = true; list = []; };

    const draw = () => {
      pop.replaceChildren();

        d.append(el('b', null, c.name)); if (c.description) d.append(el('span', null, c.description));
        d.onmousedown = (e) => { e.preventDefault(); pick(i); };
        pop.append(d);
      });
      pop.hidden = !list.length;
      pop.children[idx]?.scrollIntoView({ block: 'nearest' });
    };

      const m = ta.value.match(/^\/([\w:.-]*)$/);

    }
    for (const id of targets.filter((t) => !known.some((r) => r.project === t))) target(id, id, '이 맥에서 저장소를 찾지 못함');
    box.append(afRow('대상 저장소', 'HM_AUTOFIX_REPOS', tl, ['무인 실행은 여기 넣은 저장소만 봅니다. 모니터링 설정이 없는 저장소는 넣어도 건너뜁니다.']));
    const iv = C.interval_minutes ?? null;
    const sched = [];
    if (aschedule) {
      const st = aschedule.status?.autofix;
      sched.push(el('span', aschedule.install_rc === 0 ? 'ok' : 'warn', `정기 실행 등록: ${aschedule.install || '(출력 없음)'}`));
      sched.push(st ? `등록 상태: sweep 전용 ${st.loaded ? '켜짐' : '꺼짐'}${st.interval_minutes ? ` · ${st.interval_minutes}분` : ''}` : '등록 상태: sweep 전용 없음 — backfill 주기에 돕니다');
    }
    box.append(afRow('sweep 주기', 'HM_AUTOFIX_INTERVAL_MINUTES',
      afLadder(iv, withCur([[null, '정기 실행 주기'], [15, '15분'], [30, '30분'], [60, '1시간']], iv, (n) => `${n}분`), (k) => afConfigure({ interval_minutes: k ?? 'off' })),
      ['검증과 새 에러 확인 주기입니다. 바꾸면 schedule.sh install-autofix로 sweep 전용 정기 실행만 등록(또는 내림)하고 결과를 여기 보여 줍니다. 등록해도 바로 돌지 않고 주기가 한 번 지난 뒤 첫 sweep이 돕니다.', ...sched]));
    box.append(afRow('하루 상한', 'HM_AUTOFIX_DAILY_MAX',
      afLadder(C.daily_max, withCur([[1, '1회'], [3, '3회 (기본)'], [5, '5회'], [10, '10회']], C.daily_max, (n) => `${n}회`), (k) => afConfigure({ daily_max: k })),
      [`하루에 시작하는 수정 실행 수(전체 저장소 합계). 오늘 ${adata.today.started}회 시작함.`]));
    box.append(afRow('에러당 PR 상한', 'HM_AUTOFIX_MAX_ATTEMPTS',
      afLadder(C.max_attempts, withCur([[1, '1개'], [2, '2개 (기본)'], [3, '3개'], [5, '5개']], C.max_attempts, (n) => `${n}개`), (k) => afConfigure({ max_attempts: k })),
      ['같은 에러가 고친 뒤 다시 나오면 이 수만큼만 다시 고치고, 넘으면 포기로 남겨 사람에게 넘깁니다.']));
    box.append(afRow('실행당 예산', 'HM_AUTOFIX_BUDGET_USD',
      afLadder(C.budget_usd, withCur([[2, '$2'], [5, '$5'], [10, '$10 (기본)'], [20, '$20']], C.budget_usd, (n) => `$${n}`), (k) => afConfigure({ budget_usd: k })),
      [`수정 실행 한 번(에러 1건)의 Claude 비용 상한. 지금까지 누적 ${usd(adata.cost_usd)}.`]));
  }

  function renderAll() { renderSidebar(); renderBoard(); }

  if (SERVER) {
    setInterval(() => { if ((view === 'autofix' || (view === 'settings' && stab === 'autofix')) && !document.hidden) loadAutofix(false); }, 15000);
    refresh().then(() => { loadSettings(true); loadAutofix(true); }).catch((e) => toast('상태를 읽지 못함: ' + e.message, false)); setInterval(() => refresh().catch(() => {}), 5000);
    setInterval(() => { if (view === 'impact' && !document.hidden) loadImpact(false); }, 4000);
    // 뒤에 있던 탭으로 돌아오면 바로 새로 읽는다(뒤 탭 타이머는 브라우저가 늦춰서 화면이 낡아 있을 수 있음)
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh().catch(() => {}); });
  }
  else renderAll();
})();
</script>
</body>
</html>
