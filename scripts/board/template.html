<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Board</title>
<script>if (!new URLSearchParams(location.search).get("t")) { const m = document.createElement("meta"); m.httpEquiv = "refresh"; m.content = "60"; document.head.appendChild(m); }</script>
<style>
:root {
  --bg: #f6f7f9; --side: #eef0f3; --panel: #ffffff; --line: #e3e6eb; --text: #1b1f24; --muted: #646d78;
  --human: #c2410c; --human-bg: #fff4ec; --run: #2563eb; --queue: #7c3aed;
  --block: #a16207; --done: #15803d; --chip: #eef0f3; --hover: #e4e7ec; --shadow: 0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --side: #0b0d10; --panel: #171b21; --line: #272d36; --text: #e6e9ee; --muted: #9aa3ae;
    --human: #fb923c; --human-bg: #2a1a10; --run: #60a5fa; --queue: #a78bfa;
    --block: #facc15; --done: #4ade80; --chip: #222831; --hover: #1b2028; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; }
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
aside { background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { font-weight: 700; font-size: 15px; padding: 0 8px; letter-spacing: -.01em; }
.navgroup h3 { margin: 0 8px 6px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.nav { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; color: var(--text);
  font: inherit; text-align: left; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
.nav:hover { background: var(--hover); }
.nav[aria-current="true"] { background: var(--panel); box-shadow: var(--shadow); font-weight: 600; }
.nav .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.badge { font-size: 11px; min-width: 20px; text-align: center; padding: 0 6px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.badge.alert { background: var(--human); color: #fff; }
.nav.proj { padding: 4px 8px; font-size: 13px; }
.sidefoot { margin-top: auto; font-size: 11px; color: var(--muted); padding: 0 8px; }
main { min-width: 0; padding: 20px 24px 32px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 4px; }
h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
.desc { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.board { display: grid; gap: 16px; align-items: start; }
@media (max-width: 1200px) { .board { grid-template-columns: 1fr 1fr !important; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; }
  main { padding: 16px; }
  .board { grid-template-columns: 1fr !important; }
}
.col { min-width: 0; }
.col h2 { font-size: 13px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.col h2 .dot { width: 8px; height: 8px; border-radius: 50%; }
.col h2 .n { color: var(--muted); font-weight: 500; }
.dot.needs_human { background: var(--human); } .dot.running { background: var(--run); } .dot.queued { background: var(--queue); }
.dot.blocked { background: var(--block); } .dot.done { background: var(--done); }
.dot.review { background: var(--run); box-shadow: 0 0 0 2px color-mix(in srgb, var(--run) 30%, transparent); } .dot.idle { background: var(--muted); }
.card[data-state="review"] { border-left-color: var(--run); }
.card[data-state="idle"] { border-left-color: var(--line); opacity: .85; }
.part { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); margin: 6px 0 2px; }
.part .n { font-weight: 400; }
.part button, .colbtn { margin-left: auto; font: inherit; font-size: 11px; font-weight: 400; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
.colbtn { margin: 4px 0; width: 100%; padding: 6px; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.refs a, .refs span { font-size: 11px; text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--text); background: var(--chip); }
.refs a:hover { border-color: var(--muted); }
.refs a.pr::before { content: "PR "; color: var(--muted); }
.refs a.jira::before, .refs span.jira::before { content: "Jira "; color: var(--muted); }
.chatnote .refs { margin-top: 0; }
.cardtools { display: flex; gap: 6px; margin-top: 8px; }
.cardtools button { font: inherit; font-size: 11px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.cardtools button:hover { color: var(--text); border-color: var(--muted); }
#cdlg .wt { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; word-break: break-all; }
#cdlg .wt pre { margin: 6px 0 0; font-size: 11px; white-space: pre-wrap; }
#cdlg .check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text); margin-top: 10px; }
#cdlg .check input { width: auto; }
.empty { color: var(--muted); font-size: 12px; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  margin-bottom: 10px; box-shadow: var(--shadow); border-left: 3px solid var(--line); }
.card[data-state="needs_human"] { border-left-color: var(--human); }
.card[data-state="running"] { border-left-color: var(--run); }
.card[data-state="queued"] { border-left-color: var(--queue); }
.card[data-state="blocked"] { border-left-color: var(--block); }
.card[data-state="done"] { border-left-color: var(--done); }
.card.group { background: var(--human-bg); }
.top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.kind { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--chip); color: var(--text); }
.proj { font-weight: 600; color: var(--text); }
.ago { margin-left: auto; }
.title { margin: 6px 0 0; font-weight: 600; }
.detail { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
.detail.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chips span { font-size: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.actions a, .actions button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent;
  color: var(--text); border-radius: 6px; padding: 3px 9px; text-decoration: none; cursor: pointer; }
.actions a.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.actions button.run { background: var(--run); color: #fff; border-color: var(--run); }
.card[data-state="queued"] .actions button.run { background: var(--queue); border-color: var(--queue); }
.card[data-state="needs_human"] .actions button.run { background: var(--human); border-color: var(--human); }
.actions button:disabled { opacity: .6; cursor: progress; }
.meta { color: var(--muted); font-size: 12px; }
.more { font-size: 12px; color: var(--muted); background: none; border: 0; padding: 4px 0 0; cursor: pointer; font: inherit; }
.card.wgroup .members { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.member { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; cursor: pointer; background: var(--bg); }
.member:hover { border-color: var(--muted); }
.member.selected { outline: 2px solid var(--run); outline-offset: -1px; }
.member .mrow { display: flex; gap: 6px; align-items: center; }
.member .mrow b { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member .mrow .role { flex: none; white-space: nowrap; font-size: 11px; padding: 0 5px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.member .mrow .st { flex: none; margin-left: auto; color: var(--muted); white-space: nowrap; }
.member .mdetail { color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot.sm { width: 7px; height: 7px; flex: none; }
.subs { font-size: 11px; color: var(--muted); }
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--muted); }
.card.selected { outline: 2px solid var(--run); outline-offset: -1px; }
.drawer { position: fixed; top: 0; right: 0; width: min(640px, 100vw); height: 100vh; background: var(--panel);
  border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.25); display: flex; flex-direction: column; z-index: 10; }
.drawer[hidden] { display: none; }
body.drawer-open main { margin-right: min(640px, 100vw); }
.compose[hidden] { display: none; }
.dhead { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.dhead .t { flex: 1; min-width: 0; }
.dhead .t b { display: block; font-size: 15px; }
.dhead .t span { font-size: 12px; color: var(--muted); }
.dhead button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.chat { flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.msg.user { align-self: flex-end; background: var(--run); color: #fff; border-bottom-right-radius: 3px; }
.msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
.msg.tool { align-self: flex-start; font: 11.5px ui-monospace, Menlo, monospace; color: var(--muted); padding: 2px 4px; }
.chatedge { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 0; }
.msg.tool::before { content: "⚙ "; }
.chatnote { font-size: 12px; color: var(--muted); padding: 8px 16px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chatnote button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.newbtn { margin-left: auto; font: inherit; font-size: 13px; border: 0; border-radius: 7px; padding: 5px 12px; background: var(--run); color: #fff; cursor: pointer; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 18px; width: min(560px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin: 0 0 10px; font-size: 15px; }
dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
dialog input, dialog textarea { width: 100%; font: inherit; font-size: 13px; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
dialog textarea { height: 90px; resize: vertical; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
dialog .row button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 7px; padding: 5px 12px; cursor: pointer; }
dialog .row button.primary { background: var(--run); border-color: var(--run); color: #fff; }
.compose { display: flex; gap: 8px; padding: 8px 16px 14px; }
.compose textarea { flex: 1; resize: none; height: 64px; font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.compose button { font: inherit; border: 0; border-radius: 8px; padding: 0 16px; background: var(--run); color: #fff; cursor: pointer; }
.compose button:disabled { opacity: .5; }
.qbox { margin: 8px 16px 0; padding: 10px 12px; border: 1px solid var(--human); border-radius: 10px; font-size: 13px; }
.qbox .q { margin: 8px 0 6px; font-weight: 600; }
.qbox .q:first-child { margin-top: 0; }
.qbox .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.qbox .opts button { font: inherit; font-size: 13px; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--text);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; max-width: 100%; }
.qbox .opts button small { display: block; color: var(--muted); font-size: 11px; }
.qbox .opts button[aria-pressed="true"] { border-color: var(--run); outline: 1px solid var(--run); }
.qbox .qfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: 12px; }
.qbox .qfoot button { font: inherit; font-size: 13px; border: 0; border-radius: 7px; padding: 5px 12px; background: var(--run); color: #fff; cursor: pointer; }
.qbox .qfoot button:disabled { opacity: .5; }
.perm { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--human); border-radius: 8px; font-size: 12px; }
.perm b { display: block; margin-bottom: 4px; }
.perm pre { margin: 0 0 8px; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow: auto; font-size: 12px;
  background: var(--bg); padding: 6px 8px; border-radius: 6px; }
.perm .row { display: flex; gap: 6px; }
.perm button { font: inherit; font-size: 12px; border-radius: 6px; padding: 4px 12px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
.perm button.allow { background: var(--done); border-color: var(--done); color: #fff; }
#dperm { margin: 8px 16px 0; }
#dperm .perm { margin: 0; }
.acwrap { position: relative; flex: 1; display: flex; }
.acwrap textarea { flex: 1; }
.ac { position: absolute; left: 0; right: 0; bottom: calc(100% + 4px); max-height: 260px; overflow: auto; z-index: 20;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: 13px; }
.ac div { padding: 6px 10px; cursor: pointer; }
.ac div b { font-weight: 600; }
.ac div span { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac div[aria-selected="true"] { background: var(--bg); }
dialog .acwrap .ac { bottom: auto; top: calc(100% + 4px); }
.srows { display: flex; flex-direction: column; gap: 8px; max-width: 1100px; }
.srow { display: grid; grid-template-columns: minmax(160px, 1.1fr) auto minmax(160px, 1fr); gap: 16px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.srow .nm b { display: block; font-size: 14px; }
.srow .nm small { color: var(--muted); font-size: 11px; word-break: break-all; }
.ladder { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.ladder button { font: inherit; font-size: 12px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.ladder button:last-child { border-right: 0; }
.ladder button[aria-pressed="true"] { background: var(--run); color: #fff; }
.ladder button:hover:not([aria-pressed="true"]) { background: var(--hover); color: var(--text); }
.srow .meta { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.srow .meta .chg { color: var(--run); cursor: pointer; }
.srow .meta .warn { color: var(--human); }
.srow .meta .ok { color: var(--ok, #2f9e44); }
.srow .meta .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.srow .meta .acts button { font: inherit; font-size: 12px; background: none; border: 0; padding: 0; color: var(--run); cursor: pointer; }
.srow.mine { grid-template-columns: minmax(160px, 1.1fr) auto minmax(160px, 1fr); border-color: var(--run); }
.stabs { margin-bottom: 6px; align-self: flex-start; }
.ladder.mini button { font-size: 11px; padding: 3px 8px; }
.meta .daily { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.stabs button { font-size: 13px; padding: 7px 14px; }
.ssub { font-size: 12px; color: var(--muted); margin: 14px 0 2px; }
#sdlg .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
#sdlg .checks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
#sdlg .checks label { display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 13px; margin: 4px 0; }
#sdlg .checks input, #sdlg select { width: auto; }
#sdlg select { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; }
#sdlg .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
#sdlg fieldset { border: 0; padding: 0; margin: 0; }
#sdlg [hidden] { display: none !important; }
#toast { position: fixed; right: 20px; bottom: 20px; max-width: 420px; padding: 10px 14px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: 13px; }
#toast[data-ok="true"] { border-left: 3px solid var(--done); }
#toast[data-ok="false"] { border-left: 3px solid var(--human); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Harness Board</div>
    <div class="navgroup" id="views"></div>
    <div class="navgroup"><h3>프로젝트</h3><div id="projects"></div></div>
    <div class="sidefoot" id="foot"></div>
  </aside>
  <main>
    <div class="head"><h1 id="vtitle"></h1><span class="meta" id="vmeta"></span><button class="newbtn" id="newbtn" hidden>+ 새 세션</button></div>
    <p class="desc" id="vdesc"></p>
    <div class="board" id="board"></div>
  </main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="세션 대화">
  <div class="dhead">
    <div class="t"><b id="dtitle"></b><span id="dsub"></span></div>
    <button id="dclose" aria-label="닫기">닫기</button>
  </div>
  <div class="chat" id="dchat"></div>
  <div id="dperm"></div>
  <div class="qbox" id="dq" hidden></div>
  <div class="chatnote" id="dnote"></div>
  <form class="compose" id="dform">
    <div class="acwrap"><textarea id="dinput" placeholder="이어서 지시 · /로 스킬 (Enter 전송 · Shift+Enter 줄바꿈)"></textarea></div>
    <button type="submit" id="dsend">보내기</button>
  </form>
</aside>
<dialog id="dlg">
  <form method="dialog">
    <h3>새 세션 (claude 백그라운드)</h3>
    <label for="fcwd">작업 경로</label>
    <input id="fcwd" list="repos" required placeholder="/Users/.../repo">
    <datalist id="repos"></datalist>
    <label for="fname">이름 (선택)</label>
    <input id="fname" placeholder="예: NJ-1234 버그 확인">
    <label for="fprompt">첫 지시</label>
    <div class="acwrap"><textarea id="fprompt" required placeholder="/로 시작하면 스킬·명령 자동완성"></textarea></div>
    <div class="row"><button value="cancel" formnovalidate>취소</button><button class="primary" value="ok">띄우기</button></div>
  </form>
</dialog>
<dialog id="cdlg">
  <form method="dialog">
    <h3>세션 정리</h3>
    <p class="desc" id="cdesc"></p>
    <div class="wt" id="cwt"></div>
    <label class="check"><input type="checkbox" id="cwtbox"> <span id="cwtlabel">worktree도 삭제</span></label>
    <div class="row"><button value="cancel" formnovalidate>취소</button><button class="primary" value="ok">정리</button></div>
  </form>
</dialog>
<dialog id="sdlg">
  <form method="dialog" id="sform">
    <h3 id="stitle"></h3>
    <p class="desc">병합·배포 단계가 쓰는 저장소 사실입니다. 확인하면 이 저장소에서 /ai-harness:harness-init 설정 변경 세션이 돌아 harness.json을 고친 draft PR을 엽니다. 병합 여부·조건은 각자의 설정이라 여기서 바꾸지 않습니다.</p>
    <label for="sbase">기준 브랜치 (병합 대상)</label><input id="sbase" required>
    <label for="sdeploycmd">배포 확인 명령 — 배포된 커밋이 $HM_MERGE_COMMIT 과 같을 때 0으로 끝나야 함 (비우면 없음)</label>
    <input id="sdeploycmd" placeholder='scripts/deployed.sh "$HM_MERGE_COMMIT"'>
    <label for="ssmokecmd">스모크 명령 (비우면 없음)</label>
    <input id="ssmokecmd" placeholder="curl -fsS https://dv.example.com/health">
    <p class="note" id="snote"></p>
    <div class="row"><button value="cancel" formnovalidate>취소</button><button class="primary" value="ok">변경 PR 만들기</button></div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>
<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
  let data = JSON.parse(document.getElementById('data').textContent);
  const TOKEN = new URLSearchParams(location.search).get('t');
  const SERVER = data === null && !!TOKEN;

  const VIEWS = {
    work: {
      label: '작업', sub: '내가 시킨 에이전트 세션',
      desc: '이 맥에서 돌고 있는 Claude 세션 전체(어느 터미널이든). 카드를 누르면 대화가 실시간으로 보이고, 백그라운드 세션은 여기서 이어서 지시할 수 있음.',
      cols: [
        { label: '내 차례', parts: [{ state: 'needs_human', label: '답해야 함' }, { state: 'review', label: '결과 확인' }] },
        { state: 'running', label: '작업 중' },
        { state: 'idle', label: '쉬는 중', collapsible: true },
      ],
    },
    harness: {
      label: '하네스 동작', sub: '자동 개선 · 동기화 · 스케줄',
      desc: '하네스가 스스로 돌리는 harvest·sync·규칙 적용과 정기 실행. 사람 필요는 PR 검토나 직접 마무리가 필요한 것.',
      cols: [
        { state: 'needs_human', label: '사람 필요' },
        { state: 'queued', label: '대기' },
        { state: 'running', label: '진행 중' },
        { state: 'blocked', label: '막힘' },
        { state: 'done', label: '완료' },
      ],
    },
    settings: {
      label: '하네스 설정', sub: '내 자동화 단계', custom: true,
      desc: '에이전트가 PR 뒤 어디까지 스스로 갈지는 내 설정이라 바로 바뀝니다(다른 사람에게 영향 없음, 고르지 않으면 PR까지). 저장소별 단계가 내 기본보다 우선합니다. 저장소 harness.json은 에이전트가 커밋·PR을 해도 되는지와 기준 브랜치·배포·스모크 명령만 정하고 PR로 바꿉니다. 병합은 호스트가 기준 브랜치에 필수 승인을 걸어 둔 저장소에서만 일어납니다.',
      cols: [],
    },
  };
  const KIND = { harvest: 'harvest', 'harvest-global': 'harvest 전역', sync: 'sync', runner: '워크플로', rule: '규칙', schedule: '스케줄', agent: '대화형', bg: '백그라운드' };
  const DRAWER_ACTIONS = ['view', 'send', 'cleanup'];
  const ACTION_LABEL = { harvest_now: 'harvest 지금 돌리기', open_agent: '세션으로 열기' };
  const CAUSE = {
    bitbucket_ip: {
      title: 'Bitbucket IP 화이트리스트 밖이라 PR을 열지 못함',
      detail: '같은 원인으로 자동 sync가 멈췄습니다. 사내망/VPN에 연결된 상태에서 다시 실행하면 한 번에 풀립니다.',
      cmd: '/ai-harness:harness-init --sync --apply',
    },
  };

  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  let view = ['harness', 'settings'].includes(store('hb-view')) ? store('hb-view') : 'work';
  let filter = 'all';
  let openIdle = store('hb-idle') === '1';

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const ago = (iso) => {
    if (!iso) return '';
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (s < 3600) return `${Math.max(1, Math.round(s / 60))}분 전`;
    if (s < 86400) return `${Math.round(s / 3600)}시간 전`;
    return `${Math.round(s / 86400)}일 전`;
  };
  const toast = (msg, ok) => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.dataset.ok = String(ok); t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 5000);
  };
  const copyBtn = (label, value) => {
    const b = el('button', null, label); b.title = value;
    b.onclick = async () => { try { await navigator.clipboard.writeText(value); b.textContent = '복사됨'; setTimeout(() => (b.textContent = label), 1200); } catch (e) { prompt('복사', value); } };
    return b;
  };
  const prLabel = (url) => { const m = url && url.match(/pull-requests\/(\d+)|pull\/(\d+)/); return m ? `PR #${m[1] || m[2]}` : 'PR'; };
  const inView = (v) => data.items.filter((i) => (i.section || 'harness') === v);

  async function act(it, action, btn) {
    btn.disabled = true; const label = btn.textContent; btn.textContent = '실행 중…';
    try {
      const r = await fetch('/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: TOKEN, id: it.id, action }) });
      const res = await r.json();
      toast(res.message || (res.ok ? '완료' : '실패'), !!res.ok);
      if (res.ok) await refresh();
    } catch (e) { toast('서버 연결 실패: ' + e.message, false); }
    btn.disabled = false; btn.textContent = label;
  }
  // 누르는 도중에 다시 그리면 클릭이 사라진다 → 버튼을 뗀 뒤로 미룬다. 내용이 같으면 다시 그리지 않는다.
  let pressing = false, renderPending = false, lastSig = '';
  document.addEventListener('pointerdown', () => { pressing = true; }, true);
  document.addEventListener('pointerup', () => { pressing = false; if (renderPending) setTimeout(flush, 0); }, true);
  function flush() {
    if (pressing) { renderPending = true; return; }
    renderPending = false; renderAll(); if (selected) renderDrawerMeta();
  }
  async function refresh() {
    const r = await fetch('/status.json?t=' + encodeURIComponent(TOKEN), { cache: 'no-store' });
    const next = await r.json();
    const sig = JSON.stringify(next.items);
    if (sig === lastSig) return;
    lastSig = sig; data = next; flush();
  }

  async function markSeen(ids) {
    await fetch('/seen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: TOKEN, ids }) });
    data.items.forEach((i) => { if (ids.includes(i.id) && i.state === 'review') i.state = 'idle'; });
    lastSig = ''; renderAll();
  }
  function refsBox(it) {
    const r = it.refs; if (!r || (!r.prs.length && !r.issues.length)) return null;
    const box = el('div', 'refs');
    for (const u of r.prs) {
      const a = el('a', 'pr', u.match(/(?:pull-requests|pull)\/(\d+)/) ? `${u.split('/')[4]} #${u.match(/(\d+)$/)[1]}` : u);
      a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.title = u; a.onclick = (e) => e.stopPropagation(); box.append(a);
    }
    for (const k of r.issues) {
      if (data.jira_base) { const a = el('a', 'jira', k); a.href = `${data.jira_base}/browse/${encodeURIComponent(k)}`; a.target = '_blank'; a.rel = 'noopener'; a.onclick = (e) => e.stopPropagation(); box.append(a); }
      else box.append(el('span', 'jira', k));
    }
    return box;
  }
  function cardTools(it) {
    const box = el('div', 'cardtools');
    if (it.state === 'review') { const b = el('button', null, '읽음'); b.onclick = (e) => { e.stopPropagation(); markSeen([it.id]); }; box.append(b); }
    if ((it.actions || []).includes('cleanup')) { const b = el('button', null, '정리'); b.onclick = (e) => { e.stopPropagation(); openCleanup(it); }; box.append(b); }
    return box.childNodes.length ? box : null;
  }
  let cleaning = null;
  async function openCleanup(it) {
    cleaning = it;
    dr('cdesc').textContent = (it.live ? (it.kind === 'bg' ? '백그라운드 세션을 멈추고 ' : 'Orca 터미널을 닫아 세션을 끝내고 ') : '')
      + `"${it.title}"을 보드에서 숨깁니다. 대화 기록은 남아서 나중에 claude --resume 으로 다시 열 수 있습니다.`;
    const wt = dr('cwt'), box = dr('cwtbox');
    wt.textContent = 'worktree 확인 중…'; box.checked = false; box.disabled = true;
    dr('cdlg').showModal();
    try {
      const res = await (await fetch(`/cleanup-preview?t=${encodeURIComponent(TOKEN)}&id=${encodeURIComponent(it.id)}`)).json();
      const w = res.worktree || {};
      wt.replaceChildren(el('div', null, w.path || it.cwd || '?'), el('div', null, w.branch ? `브랜치 ${w.branch}` : ''));
      if (w.removable) { box.disabled = false; dr('cwtlabel').textContent = 'worktree도 삭제 (변경·미푸시 커밋 없음 확인됨)'; }
      else { dr('cwtlabel').textContent = 'worktree는 지우지 않음 — ' + (w.reason || '확인 실패'); }
      if (w.dirty) wt.append(el('pre', null, w.dirty.join('\n')));
    } catch (e) { wt.textContent = '확인 실패: ' + e.message; }
  }
  document.getElementById('cdlg').addEventListener('close', async () => {
    if (dr('cdlg').returnValue !== 'ok' || !cleaning) return;
    const res = await post({ id: cleaning.id, action: 'cleanup', worktree: dr('cwtbox').checked });
    toast(res.message, res.ok);
    if (res.ok) { if (selected === cleaning.id) closeDrawer(); lastSig = ''; refresh(); }
    cleaning = null;
  });
  function permBox(it) {
    const p = it.permission, box = el('div', 'perm');
    box.append(el('b', null, `권한 요청 · ${p.tool}`), el('pre', null, p.input));
    const row = el('div', 'row');
    for (const [decision, label] of [['allow', '허용'], ['deny', '거부']]) {
      const b = el('button', decision === 'allow' ? 'allow' : null, label);
      b.onclick = async (e) => {
        e.stopPropagation(); row.querySelectorAll('button').forEach((x) => (x.disabled = true));
        const res = await (await fetch('/permission', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ t: TOKEN, pid: p.pid, decision }) })).json();
        toast(res.message, res.ok); refresh();
      };
      row.append(b);
    }
    box.append(row);
    return box;
  }
  function card(it) {
    const c = el('article', 'card'); c.dataset.state = it.state;
    const top = el('div', 'top');
    top.append(el('span', 'kind', KIND[it.kind] || it.kind), el('span', 'proj', it.project), el('span', 'ago', ago(it.at)));
    const tt = el('p', 'title', it.title); if (it.term && it.term !== it.title) tt.title = '터미널: ' + it.term;
    c.append(top, tt);
    if (it.detail) {
      const d = el('p', 'detail clamp', it.detail.replace(/\*\*/g, '').replace(/\\n/g, '\n'));
      c.append(d);
      if (it.detail.length > 140) {
        const m = el('button', 'more', '더 보기');
        m.onclick = () => { d.classList.toggle('clamp'); m.textContent = d.classList.contains('clamp') ? '더 보기' : '접기'; };
        c.append(m);
      }
    }
    const a = el('div', 'actions');
    if (SERVER) for (const action of (it.actions || []).filter((x) => !DRAWER_ACTIONS.includes(x))) {
      const b = el('button', 'run', ACTION_LABEL[action] || action);
      b.onclick = () => act(it, action, b);
      a.append(b);
    }
    if (it.link) { const l = el('a', it.state === 'needs_human' ? 'primary' : null, prLabel(it.link) + (it.state === 'needs_human' ? ' 검토' : '')); l.href = it.link; l.target = '_blank'; l.rel = 'noopener'; a.append(l); }
    if (it.cmd) a.append(copyBtn('명령 복사', it.cmd));
    if (it.log) a.append(copyBtn('로그 경로', it.log));
    if (it.path && !SERVER) a.append(copyBtn('경로 복사', it.path));
    if (it.cost != null) a.append(el('span', 'meta', `$${it.cost.toFixed(2)} · ${Math.round((it.duration_s || 0) / 60)}분`));
    if (a.childNodes.length) c.append(a);
    if (it.subagents) c.append(el('div', 'subs', subsLabel(it.subagents)));
    if (SERVER && it.permission) c.append(permBox(it));
    { const r = refsBox(it); if (r) c.append(r); }
    if (SERVER) { const t = cardTools(it); if (t) c.append(t); }
    if (SERVER && (it.actions || []).includes('view')) {
      c.classList.add('clickable');
      if (selected === it.id) c.classList.add('selected');
      c.addEventListener('click', (e) => { if (!e.target.closest('button, a')) openDrawer(it); });
    }
    return c;
  }

  let selected = null, pollTimer = null;
  const dr = (id) => document.getElementById(id);
  async function post(body) {
    const r = await fetch('/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: TOKEN, ...body }) });
    return r.json();
  }
  let offset = 0, current = null;
  const addMsg = (m) => { const d = el('div', 'msg ' + m.role, m.text); dr('dchat').append(d); };
  // 요청은 한 번에 하나만. 응답이 늦어 다음 폴링이 같은 위치에서 또 출발하면 같은 메시지가 겹쳐 붙는다.
  let polling = false;
  async function pollChat() {
    if (!selected || polling) return;
    polling = true;
    const id = selected, from = offset;
    try {
      const r = await fetch(`/transcript?t=${encodeURIComponent(TOKEN)}&id=${encodeURIComponent(id)}&offset=${from}`, { cache: 'no-store' });
      const res = await r.json();
      if (id !== selected || from !== offset) return;   // 그사이 다른 세션을 열었거나 위치가 바뀜 → 버린다
      if (!res.ok) { dr('dchat').replaceChildren(el('div', 'msg tool', res.message)); return; }
      const chat = dr('dchat');
      const atBottom = res.reset || chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60;
      if (res.reset) { chat.replaceChildren(); topOffset = res.start; olderBusy = false; if (topOffset === 0) chat.append(el('div', 'chatedge', '대화 처음')); }
      res.messages.forEach(addMsg);
      offset = res.offset;
      renderQuestion(res.question);
      if (atBottom) chat.scrollTop = chat.scrollHeight;
    } catch (e) {} finally { polling = false; }
  }
  // 위로 끝까지 올리면 이전 대화를 한 페이지씩 앞에 붙인다(보던 위치는 그대로)
  let topOffset = 0, olderBusy = false;
  async function loadOlder() {
    if (olderBusy || !selected || topOffset <= 0) return;
    olderBusy = true;
    const chat = dr('dchat'), id = selected;
    const marker = el('div', 'chatedge', '이전 대화 불러오는 중…'); chat.prepend(marker);
    try {
      const r = await fetch(`/transcript?t=${encodeURIComponent(TOKEN)}&id=${encodeURIComponent(id)}&before=${topOffset}`, { cache: 'no-store' });
      const res = await r.json();
      if (id !== selected || !res.ok) return;
      const h = chat.scrollHeight;
      const frag = document.createDocumentFragment();
      if (res.start === 0) frag.append(el('div', 'chatedge', '대화 처음'));
      res.messages.forEach((m) => frag.append(el('div', 'msg ' + m.role, m.text)));
      marker.remove(); chat.prepend(frag);
      chat.scrollTop += chat.scrollHeight - h;
      topOffset = res.start;
    } catch (e) {} finally { marker.remove(); olderBusy = false; }
  }
  dr('dchat').addEventListener('scroll', () => { if (dr('dchat').scrollTop < 80) loadOlder(); });
  let qKey = null;
  function renderQuestion(qs) {
    const box = dr('dq');
    const canSend = current && (current.actions || []).includes('send');
    const key = qs && canSend ? JSON.stringify(qs) : null;
    if (key === qKey) return;
    qKey = key; box.replaceChildren(); box.hidden = !key;
    if (!key) return;
    const picks = qs.map(() => new Set());
    const single = qs.length === 1 && !qs[0].multiSelect;
    const sendBtn = el('button', null, '답 보내기'); sendBtn.type = 'button'; sendBtn.disabled = true;
    const submit = async () => {
      const text = qs.map((q, i) => `${q.question} → ${[...picks[i]].join(', ')}`).join('\n');
      box.querySelectorAll('button').forEach((b) => (b.disabled = true));
      const res = await post({ id: selected, action: 'send', text: '질문 답변:\n' + text });
      toast(res.message, res.ok);
      if (res.ok) { qKey = null; box.hidden = true; setTimeout(refresh, 1500); }
      else box.querySelectorAll('button').forEach((b) => (b.disabled = false));
    };
    qs.forEach((q, i) => {
      box.append(el('div', 'q', q.question));
      const opts = el('div', 'opts');
      (q.options || []).forEach((o) => {
        const b = el('button', null, o.label); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
        if (o.description) b.append(el('small', null, o.description));
        b.onclick = () => {
          if (q.multiSelect) { picks[i].has(o.label) ? picks[i].delete(o.label) : picks[i].add(o.label); }
          else { picks[i].clear(); picks[i].add(o.label); opts.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false')); }
          b.setAttribute('aria-pressed', String(picks[i].has(o.label)));
          sendBtn.disabled = picks.some((p) => p.size === 0);
          if (single) submit();
        };
        opts.append(b);
      });
      box.append(opts);
    });
    const foot = el('div', 'qfoot');
    foot.append(el('span', null, '에이전트가 묻고 있음 — 고르거나 아래 입력창에 직접 답하기'));
    if (!single) foot.append(sendBtn);
    sendBtn.onclick = submit;
    box.append(foot);
  }

  // ---- / 자동완성 ----
  const cmdCache = {};
  async function commands(cwd) {
    if (!cmdCache[cwd]) cmdCache[cwd] = fetch(`/commands?t=${encodeURIComponent(TOKEN)}&cwd=${encodeURIComponent(cwd || '')}`).then((r) => r.json()).catch(() => []);
    return cmdCache[cwd];
  }
  function autocomplete(ta, cwdOf) {
    const pop = el('div', 'ac'); pop.hidden = true; pop.setAttribute('role', 'listbox'); ta.parentElement.append(pop);
    let list = [], idx = 0;
    const close = () => { pop.hidden = true; list = []; };
    const pick = (i) => { ta.value = list[i].name + ' '; close(); ta.focus(); };
    const draw = () => {
      pop.replaceChildren();
      list.forEach((c, i) => {
        const d = el('div'); d.setAttribute('role', 'option'); d.setAttribute('aria-selected', String(i === idx));
        d.append(el('b', null, c.name)); if (c.description) d.append(el('span', null, c.description));
        d.onmousedown = (e) => { e.preventDefault(); pick(i); };
        pop.append(d);
      });
      pop.hidden = !list.length;
      pop.children[idx]?.scrollIntoView({ block: 'nearest' });
    };
    ta.addEventListener('input', async () => {
      const m = ta.value.match(/^\/([\w:.-]*)$/);
      if (!m) return close();
      const q = m[1].toLowerCase();
      const all = await commands(cwdOf());
      list = all.filter((c) => c.name.slice(1).toLowerCase().includes(q))
        .sort((a, b) => a.name.slice(1).toLowerCase().startsWith(q) === b.name.slice(1).toLowerCase().startsWith(q) ? 0 : a.name.slice(1).toLowerCase().startsWith(q) ? -1 : 1)
        .slice(0, 30);
      idx = 0; draw();
    });
    ta.addEventListener('keydown', (e) => {
      if (pop.hidden || e.isComposing) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); idx = (idx + (e.key === 'ArrowDown' ? 1 : list.length - 1)) % list.length; draw(); }
      else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopImmediatePropagation(); pick(idx); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    }, true);
    ta.addEventListener('blur', () => setTimeout(close, 100));
  }
  if (SERVER) {
    autocomplete(dr('dinput'), () => current?.cwd);
    autocomplete(dr('fprompt'), () => dr('fcwd').value.trim());
  }

  const STATE_KO = { needs_human: '답해야 함', review: '결과 확인', running: '작업 중', idle: '쉬는 중', done: '끝남' };
  function renderDrawerMeta() {
    const it = data.items.find((x) => x.id === selected) || current; if (!it) return;
    current = it;
    const dp = dr('dperm'), pk = it.permission ? it.permission.pid : '';
    if (dp.dataset.pid !== pk) { dp.dataset.pid = pk; dp.replaceChildren(...(it.permission ? [permBox(it)] : [])); }
    dr('dtitle').textContent = it.title;
    const gctx = it.group ? `${it.group.title} 묶음의 ${it.group.role === 'coord' ? '내가 시킨 세션' : '작업자'} · ` : '';
    dr('dsub').textContent = `${gctx}${it.term && it.term !== it.title ? it.term + ' · ' : ''}${it.project} · ${KIND[it.kind] || it.kind} · ${STATE_KO[it.state] || it.state}${it.live ? '' : ' · 종료됨'}`;
    const canSend = (it.actions || []).includes('send');
    dr('dform').hidden = !canSend;
    const note = dr('dnote'); note.replaceChildren();
    if (canSend && it.kind === 'agent') note.append(el('span', null, it.status === 'busy' ? 'Orca 터미널에 직접 입력합니다 — 작업 중이라 끝난 뒤 이어서 처리됩니다.' : 'Orca 터미널에 직접 입력합니다.'));

        else if (p.error) meta.append(el('span', 'warn', `브랜치 보호(${p.base}): 읽지 못함 — 러너는 병합하지 않고 넘김 (${p.error})`));
        else if (p.approvals < 1) meta.append(el('span', 'warn', `브랜치 보호(${p.base}): 필수 승인 없음 — 러너는 병합하지 않고 넘김`));
        else meta.append(el('span', 'ok', `브랜치 보호(${p.base}): 필수 승인 ${p.approvals}${p.checks ? ` · 필수 체크 ${p.checks}` : ''} — 병합 가능`));
      }
      if (r.change) {
        const c = r.change;
        const st = { needs_human: '답해야 함', review: '결과 확인', running: '작업 중', idle: '끝남', gone: '세션 없음' }[c.state] || c.state;
        const s = el('span', 'chg', `저장소 사실 변경 · 세션 ${st}${c.prs && c.prs.length ? ' · PR 있음' : ''}`);
        if (c.item_id) s.onclick = () => { const it = data.items.find((i) => i.id === c.item_id); if (it) openDrawer(it); };
        meta.append(s);
        for (const u of c.prs || []) { const a = el('a', null, 'PR 열기'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; meta.append(a); }
      }
      const acts = el('div', 'acts');
      if (e.level && e.level !== 'pr' && e.source !== 'team') {
        const b = el('button', null, r.protection ? '보호 다시 확인' : '브랜치 보호 확인'); b.type = 'button';
        b.onclick = async () => {
          b.disabled = true; b.textContent = '확인 중…';
          const res = await spost('/settings/protection', { repo: r.repo });
          if (!res.ok) toast(res.message, false);
          loadSettings(true);
        };
        acts.append(b);
      }
      const f = el('button', null, '저장소 사실 고치기(PR)'); f.type = 'button'; f.onclick = () => openFacts(r); acts.append(f);
      meta.append(acts);
      row.append(meta);
      box.append(row);
    }
    if (!repos.length) box.append(el('div', 'empty', '하네스가 깔린 저장소를 찾지 못함'));
    board.append(box);
  }
  let stab = store('hb-stab') === 'harness' ? 'harness' : 'work';
  const HSTAGES = [['off', '끔'], ['run', '자동 실행 (draft PR까지)'], ['merge', '자동 실행 + 자동 병합']];
  function renderHarnessSettings(box, P, repos) {
    document.getElementById('vmeta').textContent = ['harvest', 'sync'].map((k) => `${k} ${P[`HM_${k.toUpperCase()}_AUTO`] === '1' ? (P[`HM_${k.toUpperCase()}_AUTO_MERGE`] === '1' ? '자동 병합' : '자동 실행') : '끔'}`).join(' · ');
    box.append(el('div', 'ssub', '내 설정(~/.ai-harness/config) — 나에게만, 바로 적용. 작업의 자동화 단계와 별개이고, 서로 영향을 주지 않습니다.'));
    const DESC = {
      harvest: ['자동 harvest', '쉬는 동안 쌓인 세션 기록으로 하네스 개선안(AGENTS.md·docs 규칙)을 찾아 draft PR을 엽니다.',
        '자동 병합은 독립 검토를 통과하고 변경 크기 한도 안인 PR만, CI 통과·사람 활동 없음을 확인한 뒤 병합합니다.'],
      sync: ['자동 sync', '플러그인이 새 버전이면 하네스 생성물을 최신 템플릿으로 맞추는 draft PR을 엽니다.',
        '자동 병합은 템플릿을 그대로 복사한 파일과 harness.json만 바뀐 PR을, CI 통과·사람 활동 없음을 확인한 뒤 병합합니다.'],
    };
    for (const kind of ['harvest', 'sync']) {
      const K = kind.toUpperCase();
      const cur = P[`HM_${K}_AUTO`] === '1' ? (P[`HM_${K}_AUTO_MERGE`] === '1' ? 'merge' : 'run') : 'off';
      const row = el('div', 'srow mine');
      const nm = el('div', 'nm'); nm.append(el('b', null, DESC[kind][0]), el('small', null, `HM_${K}_AUTO · HM_${K}_AUTO_MERGE`)); row.append(nm);
      const lad = el('div', 'ladder');
      for (const [k, label] of HSTAGES) {
        const b = el('button', null, label); b.type = 'button'; b.setAttribute('aria-pressed', String(cur === k));
        b.onclick = async () => {
          if (cur === k) return;
          const res = await spost('/settings/harness', { kind, stage: k });
          toast(res.message, res.ok); if (res.ok) loadSettings(true);
        };
        lad.append(b);
      }
      row.append(lad);
      const meta = el('div', 'meta');
      meta.append(el('span', null, DESC[kind][1]));
      if (cur !== 'off') {
        const def = { harvest: 2, sync: 6 }[kind], now = Number(P[`HM_${K}_AUTO_DAILY_MAX`]) || def;
        const dl = el('span', 'daily'); dl.append(el('span', null, '하루 최대 (전체 저장소 합계) '));
        const dlad = el('span', 'ladder mini');
        for (const n of [...[...new Set([def, 5, 10, 20])].sort((a, b) => a - b), 1000]) {
          const b = el('button', null, n === 1000 ? '제한 없음' : `${n}회${n === def ? ' (기본)' : ''}`); b.type = 'button'; b.setAttribute('aria-pressed', String(now === n));
          b.onclick = async () => { if (now === n) return; const res = await spost('/settings/harness', { kind, daily_max: n }); toast(res.message, res.ok); if (res.ok) loadSettings(true); };
          dlad.append(b);
        }
        dl.append(dlad); meta.append(dl);
        if (kind === 'harvest') meta.append(el('span', null, now >= 1000
          ? '횟수 제한 없음 — 그래도 근거가 쌓인 batch당 1회, 한 번에 한 저장소, 실행당 비용 상한 5달러(Claude)'
          : '한 번에 한 저장소씩, 실행당 비용 상한 5달러(Claude). 상한에 걸린 저장소는 다음 날로 넘어감'));
        else if (now >= 1000) meta.append(el('span', null, '횟수 제한 없음 — 플러그인이 새 버전일 때 뒤처진 저장소마다 1회'));
      }
      if (cur === 'merge') {
        meta.append(el('span', null, DESC[kind][2]));
        meta.append(el('span', null, '저장소 설정은 필요 없음(v0.62.0~). 팀이 막고 싶으면 호스트 브랜치 보호로 — 보호에 막힌 PR은 병합하지 않음'));
      }
      row.append(meta); box.append(row);
    }
  }
  let sfacts = null;
  function openFacts(r) {
    sfacts = r;
    const mp = r.merge_policy || {};
    dr('stitle').textContent = `${r.name}: 저장소 사실`;
    dr('sbase').value = mp.base || r.suggest.base || '';
    dr('sdeploycmd').value = mp.deploy_check_cmd || '';
    dr('ssmokecmd').value = mp.smoke_cmd || '';
    dr('snote').textContent = '지금 체크아웃된 브랜치는 건드리지 않습니다. PR을 병합해야 반영됩니다.';
    dr('sdlg').showModal();
  }
  document.getElementById('sdlg').addEventListener('close', async () => {
    if (dr('sdlg').returnValue !== 'ok' || !sfacts) return;
    const r = sfacts; sfacts = null;
    const res = await spost('/settings', { repo: r.repo, base: dr('sbase').value.trim(), deploy_check_cmd: dr('sdeploycmd').value.trim(), smoke_cmd: dr('ssmokecmd').value.trim() });
    toast(res.message, res.ok);
    if (res.ok) { await refresh(); loadSettings(true); }
  });

  function renderAll() { renderSidebar(); renderBoard(); }

  if (SERVER) {
    refresh().then(() => loadSettings(true)).catch((e) => toast('상태를 읽지 못함: ' + e.message, false)); setInterval(() => refresh().catch(() => {}), 5000);
    // 뒤에 있던 탭으로 돌아오면 바로 새로 읽는다(뒤 탭 타이머는 브라우저가 늦춰서 화면이 낡아 있을 수 있음)
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh().catch(() => {}); });
  }
  else renderAll();
})();
</script>
</body>
</html>
